<div><iframe id="heat-frame" title="Heat, wind and neighbors" style="width:100%;height:1500px;border:0" loading="lazy"></iframe></div>
<script>(()=>{const frame=document.getElementById('heat-frame');frame.src='./heat-map.html?lang='+(document.documentElement.lang||'th')+'&area='+encodeURIComponent(document.getElementById('ul-area').value||'cw');window.addEventListener('message',e=>{if(e.source===frame.contentWindow&&e.data?.type==='ts-heat-height'&&Number.isFinite(e.data.height))frame.style.height=Math.max(900,Math.min(6000,e.data.height+16))+'px';});})();</script>

<html lang="en">
<head>
<meta charset="utf-8">
<title>FMR — Forklift Mobile Robot</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<script type="importmap">
{

    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",

    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",

    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}

<style>
  html,body{margin:0;height:100%;background:#eeebe5;font-family:Helvetica,Arial,sans-serif}
  three-d-stage:not(:defined){visibility:hidden}
  .tag{position:fixed;left:20px;top:18px;color:#2a2826;pointer-events:none;z-index:2}
  .tag b{display:block;font-size:15px;letter-spacing:.02em}
  .tag span{font-size:12px;color:#5d5953}

<body>
<script>if(location.search.includes('embed'))document.documentElement.classList.add('embed')</script>
<div class="tag"><b>FMR — Forklift Mobile Robot</b><span>1.5 t payload · 2.2 m mast · pallet stacker</span></div>
<three-d-stage name="fmr-forklift-robot" autorotate></three-d-stage>
<script src="three-d-stage.js"></script>
<script type="module">
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;

const M = {
  shell:  new THREE.MeshStandardMaterial({ name:'shell_white', color:0xe9e7e2, roughness:0.45, metalness:0.05 }),
  accent: new THREE.MeshStandardMaterial({ name:'safety_orange', color:0xe8692a, roughness:0.4, metalness:0.1 }),
  steel:  new THREE.MeshStandardMaterial({ name:'mast_steel', color:0x4a4d52, roughness:0.45, metalness:0.35 }),
  fork:   new THREE.MeshStandardMaterial({ name:'fork_steel', color:0x8a8e94, roughness:0.35, metalness:0.4 }),
  rubber: new THREE.MeshStandardMaterial({ name:'rubber_black', color:0x1d1e20, roughness:0.85, metalness:0 }),
  glass:  new THREE.MeshStandardMaterial({ name:'sensor_glass', color:0x101418, roughness:0.15, metalness:0.2 }),
  led:    new THREE.MeshStandardMaterial({ name:'status_led', color:0x2ad07a, emissive:0x1fbf6a, emissiveIntensity:1.2, roughness:0.3 }),
  wood:   new THREE.MeshStandardMaterial({ name:'pallet_wood', color:0xc49a64, roughness:0.8, metalness:0 }),
};

const robot = new THREE.Group(); robot.name = 'FMR';
function box(name, mat, w, h, d, x, y, z, parent = robot) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.name = name; m.position.set(x, y, z); m.castShadow = m.receiveShadow = true;
  parent.add(m); return m;
}
function cyl(name, mat, r, len, x, y, z, axis = 'z', seg = 40, parent = robot) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  m.name = name; m.position.set(x, y, z);
  if (axis === 'z') m.rotation.x = Math.PI / 2;
  if (axis === 'x') m.rotation.z = Math.PI / 2;
  m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
// Rounded-plan prism: footprint w(x) × d(z), height h, corner radius r
function roundedPrism(name, mat, w, d, h, r, x, y, z, bevel = 0.02) {
  const s = new THREE.Shape(), hw = w/2 - bevel, hd = d/2 - bevel; r = Math.min(r, hw, hd);
  s.moveTo(-hw + r, -hd); s.lineTo(hw - r, -hd); s.quadraticCurveTo(hw, -hd, hw, -hd + r);
  s.lineTo(hw, hd - r); s.quadraticCurveTo(hw, hd, hw - r, hd); s.lineTo(-hw + r, hd);
  s.quadraticCurveTo(-hw, hd, -hw, hd - r); s.lineTo(-hw, -hd + r); s.quadraticCurveTo(-hw, -hd, -hw + r, -hd);
  const g = new THREE.ExtrudeGeometry(s, { depth: h - bevel*2, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 4, curveSegments: 12 });
  g.rotateX(-Math.PI / 2); g.translate(0, bevel, 0);
  const m = new THREE.Mesh(g, mat); m.name = name; m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true; robot.add(m); return m;
}

/* ---------- Chassis (rear drive tower, forks point +x) ---------- */
const BX0 = -1.0, BX1 = 0.0, BW = 0.9;           // body x range & width
const bodyX = (BX0 + BX1) / 2, bodyL = BX1 - BX0;
box('base_frame', M.steel, bodyL - 0.04, 0.12, BW - 0.04, bodyX, 0.12, 0);
roundedPrism('body_shell', M.shell, bodyL, BW, 1.05, 0.14, bodyX, 0.16, 0);
roundedPrism('top_cap', M.steel, bodyL - 0.06, BW - 0.06, 0.04, 0.12, bodyX, 1.21, 0, 0.01);
// orange safety bumper wrapping the lower body
roundedPrism('bumper', M.accent, bodyL + 0.05, BW + 0.05, 0.14, 0.16, bodyX - 0.02, 0.1, 0, 0.03);
// side accent stripe
for (const s of [-1, 1]) {
  box('side_stripe_' + (s > 0 ? 'L' : 'R'), M.accent, 0.62, 0.035, 0.004, bodyX - 0.05, 0.92, s * (BW/2 + 0.001));
  box('side_vent_' + (s > 0 ? 'L' : 'R'), M.steel, 0.3, 0.16, 0.004, bodyX - 0.18, 0.55, s * (BW/2 + 0.001));
  box('side_scanner_' + (s > 0 ? 'L' : 'R'), M.glass, 0.12, 0.05, 0.004, bodyX + 0.28, 0.32, s * (BW/2 + 0.001));
}
// rear face: e-stop panel, HMI, scanner window
box('rear_panel', M.steel, 0.004, 0.32, 0.5, BX0 - 0.001, 0.86, 0);
box('hmi_screen', M.glass, 0.006, 0.18, 0.28, BX0 - 0.002, 0.88, -0.06);
cyl('estop_base', M.accent, 0.045, 0.03, BX0 - 0.015, 0.88, 0.17, 'x', 32);
cyl('estop_button', new THREE.MeshStandardMaterial({ name:'estop_red', color:0xc4161c, roughness:0.35 }), 0.032, 0.04, BX0 - 0.045, 0.88, 0.17, 'x', 32);
box('rear_lidar_window', M.glass, 0.006, 0.06, 0.6, BX0 - 0.002, 0.3, 0);

// top 3D lidar + status beacon
cyl('lidar_base', M.steel, 0.07, 0.05, bodyX - 0.25, 1.275, 0, 'y');
cyl('lidar_head', M.glass, 0.055, 0.08, bodyX - 0.25, 1.34, 0, 'y');
cyl('lidar_cap', M.steel, 0.06, 0.02, bodyX - 0.25, 1.39, 0, 'y');
cyl('beacon_base', M.steel, 0.04, 0.03, bodyX + 0.2, 1.265, 0.3, 'y');
cyl('beacon_lens', M.led, 0.032, 0.07, bodyX + 0.2, 1.315, 0.3, 'y');
// status LED light strip around body top
for (const s of [-1, 1]) box('led_strip_' + (s > 0 ? 'L' : 'R'), M.led, bodyL - 0.3, 0.012, 0.004, bodyX, 1.12, s * (BW/2 + 0.001));
box('led_strip_rear', M.led, 0.004, 0.012, BW - 0.3, BX0 - 0.001, 1.12, 0);

/* ---------- Wheels ---------- */
function wheel(name, r, w, x, z) {
  cyl(name + '_tire', M.rubber, r, w, x, r, z, 'z', 48);
  cyl(name + '_hub', M.fork, r * 0.55, w + 0.004, x, r, z, 'z', 32);
}
wheel('drive_wheel', 0.115, 0.08, BX0 + 0.4, 0);          // central steer-drive wheel
wheel('caster_L', 0.06, 0.05, BX0 + 0.15, 0.32);
wheel('caster_R', 0.06, 0.05, BX0 + 0.15, -0.32);

/* ---------- Straddle legs with load rollers (under forks) ---------- */
const FORK_Z = 0.2, LEG_LEN = 1.1;
for (const s of [-1, 1]) {
  const tag = s > 0 ? 'L' : 'R', z = s * (FORK_Z + 0.0);
  box('leg_' + tag, M.steel, LEG_LEN, 0.07, 0.16, BX1 + LEG_LEN/2, 0.065, z);
  box('leg_tip_' + tag, M.accent, 0.06, 0.07, 0.16, BX1 + LEG_LEN + 0.03, 0.065, z);
  wheel('load_roller_' + tag + '_a', 0.04, 0.06, BX1 + LEG_LEN - 0.08, z);
  wheel('load_roller_' + tag + '_b', 0.04, 0.06, BX1 + LEG_LEN - 0.2, z);
  box('leg_sensor_' + tag, M.glass, 0.004, 0.035, 0.08, BX1 + LEG_LEN + 0.061, 0.07, z);
}

/* ---------- Mast (two-stage telescoping) ---------- */
const MX = 0.07, MAST_H = 2.2, RAIL_Z = 0.36;
for (const s of [-1, 1]) {
  const tag = s > 0 ? 'L' : 'R';
  box('outer_rail_' + tag, M.steel, 0.08, MAST_H, 0.06, MX, 0.16 + MAST_H/2, s * RAIL_Z);
  box('inner_rail_' + tag, M.steel, 0.06, MAST_H - 0.25, 0.045, MX + 0.07, 0.35 + (MAST_H - 0.25)/2, s * (RAIL_Z - 0.06));
  cyl('lift_chain_' + tag, M.rubber, 0.012, MAST_H - 0.4, MX + 0.02, 0.3 + (MAST_H - 0.4)/2, s * 0.12, 'y', 12);
}
box('mast_top_beam', M.steel, 0.09, 0.08, RAIL_Z*2 + 0.06, MX, 0.16 + MAST_H - 0.04, 0);
box('mast_mid_beam', M.steel, 0.07, 0.06, RAIL_Z*2 - 0.06, MX + 0.07, 1.2, 0);
box('mast_base_beam', M.steel, 0.12, 0.1, RAIL_Z*2 + 0.06, MX, 0.2, 0);
cyl('lift_cylinder', M.fork, 0.04, MAST_H - 0.3, MX - 0.01, 0.25 + (MAST_H - 0.3)/2, 0, 'y', 32);
cyl('lift_cylinder_rod', M.fork, 0.022, 0.25, MX - 0.01, 0.25 + MAST_H - 0.3 + 0.1, 0, 'y', 24);
cyl('chain_sheave', M.fork, 0.05, 0.3, MX + 0.02, 0.16 + MAST_H - 0.12, 0, 'z', 32);
// mast-mounted safety camera
box('fork_camera', M.glass, 0.05, 0.05, 0.1, MX + 0.03, 0.16 + MAST_H + 0.025, 0);

/* ---------- Carriage + forks (raised, carrying pallet) ---------- */
const LIFT = 0.55;                     // fork lift height (m)
const carriage = new THREE.Group(); carriage.name = 'carriage'; carriage.position.set(MX + 0.13, LIFT, 0); robot.add(carriage);
box('carriage_plate', M.accent, 0.05, 0.42, 0.78, 0, 0.21, 0, carriage);
box('carriage_bar_top', M.steel, 0.06, 0.05, 0.8, 0.005, 0.44, 0, carriage);
box('carriage_bar_low', M.steel, 0.06, 0.05, 0.8, 0.005, 0.025, 0, carriage);
// load backrest grid
for (let i = -3; i <= 3; i++) box('backrest_bar_' + (i + 3), M.steel, 0.025, 0.42, 0.025, 0.0, 0.66, i * 0.12, carriage);
box('backrest_top', M.steel, 0.03, 0.035, 0.8, 0.0, 0.87, 0, carriage);
const FORK_LEN = 1.15;
for (const s of [-1, 1]) {
  const tag = s > 0 ? 'L' : 'R';
  box('fork_shank_' + tag, M.fork, 0.045, 0.4, 0.12, 0.05, 0.2, s * FORK_Z, carriage);
  const f = box('fork_blade_' + tag, M.fork, FORK_LEN, 0.045, 0.12, 0.05 + FORK_LEN/2, 0.0225, s * FORK_Z, carriage);
  box('fork_tip_' + tag, M.fork, 0.08, 0.025, 0.12, 0.05 + FORK_LEN + 0.04, 0.0125, s * FORK_Z, carriage);
  box('fork_tip_sensor_' + tag, M.glass, 0.03, 0.012, 0.05, 0.05 + FORK_LEN - 0.04, 0.051, s * FORK_Z, carriage);
}

/* ---------- Pallet (EUR 1200×800) with load ---------- */
const pallet = new THREE.Group(); pallet.name = 'pallet'; carriage.add(pallet);
const PX = 0.07 + 0.6, PY0 = -0.03;     // pallet center x; forks sit in pallet openings
const DT = 0.022;
for (let i = 0; i < 5; i++) box('deck_board_' + i, M.wood, 1.2, DT, 0.1, PX, PY0 + 0.144 - DT/2, -0.35 + i * 0.175, pallet);
for (const z of [-0.38, 0, 0.38]) {
  box('stringer_' + z, M.wood, 1.2, DT, 0.1, PX, PY0 + 0.1 - DT/2 + 0.001, z, pallet);
  for (const x of [-0.53, 0, 0.53]) box('block_' + x + '_' + z, M.wood, 0.14, 0.078, 0.1, PX + x, PY0 + 0.022 + 0.039, z, pallet);
  box('bottom_board_' + z, M.wood, 1.2, DT, 0.1, PX, PY0 + DT/2, z, pallet);
}
const cartonMat = new THREE.MeshStandardMaterial({ name:'carton', color:0xb88b5a, roughness:0.9 });
const tapeMat = new THREE.MeshStandardMaterial({ name:'carton_tape', color:0xd9c39c, roughness:0.7 });
let n = 0;
for (let layer = 0; layer < 2; layer++) for (let ix = 0; ix < 3; ix++) for (let iz = 0; iz < 2; iz++) {
  const cx = PX - 0.4 + ix * 0.4, cz = -0.2 + iz * 0.4, cy = PY0 + 0.144 + 0.15 + layer * 0.302;
  box('carton_' + n, cartonMat, 0.39, 0.3, 0.39, cx, cy, cz, pallet);
  box('carton_tape_' + n++, tapeMat, 0.39, 0.003, 0.06, cx, cy + 0.151, cz, pallet);
}

/* ---------- Floor safety projection (blue spot) ---------- */
const spot = new THREE.Mesh(new THREE.CircleGeometry(0.12, 40),
  new THREE.MeshStandardMaterial({ name:'safety_spot', color:0x2f7cf6, emissive:0x2f7cf6, emissiveIntensity:0.8, transparent:true, opacity:0.75 }));
spot.name = 'floor_safety_spot'; spot.rotation.x = -Math.PI/2; spot.position.set(BX0 - 0.6, 0.001, 0); robot.add(spot);

// center on origin (footprint)
const bb = new THREE.Box3().setFromObject(robot), c = bb.getCenter(new THREE.Vector3());
robot.position.x -= c.x; robot.position.z -= c.z; robot.position.y -= bb.min.y;
stage.setObject(robot);
</script>
<script src="back-link.js"></script>
</body>

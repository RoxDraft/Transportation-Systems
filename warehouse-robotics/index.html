<!doctype html>
<html lang="th">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <title>Warehouse Robotics — Transportation Systems</title>
 <style>
  :root{--ink:#173b3b;--muted:#4a6466;--teal:#176659;font-family:Inter,"Leelawadee UI",Tahoma,system-ui,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:#edf4f3;color:var(--ink);line-height:1.6}
  main{max-width:960px;margin:auto;padding:28px 24px 48px}
  h1{font-size:30px;margin:8px 0 6px}p.lead{margin:0 0 24px;color:var(--muted);max-width:680px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
  a.card{display:block;padding:18px 20px;border:1px solid #c7dad3;border-radius:16px;background:rgba(255,255,255,.8);color:inherit;text-decoration:none;transition:background .18s,transform .18s}
  a.card:hover{background:#fff;transform:translateY(-2px)}a.card:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  a.card.main{border-color:var(--teal);background:#fff}
  .card b{display:block;font-size:16px}.card span{font-size:13px;color:var(--muted)}
  .kind{display:inline-block;margin-top:8px;font-size:11px;letter-spacing:.06em;color:var(--teal)}
  footer{margin-top:28px;font-size:12px;color:var(--muted)}
 </style>
</head>
<body>
 <script src="../shared/project-language.js" data-bilingual="true"></script>
 <main>
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>
  <div class="grid" id="grid"></div>
  <footer data-t="note"></footer>
 </main>
 <script>
 (()=>{
  const th=ProjectLanguage.language==='th';
  const text={
   title:th?'Warehouse Robotics':'Warehouse Robotics',
   lead:th?'คลังสินค้าอัตโนมัติ: ลงตู้คอนเทนเนอร์ จัดพาเลท หุ่นยนต์โฟล์คลิฟต์ FMR นำของเข้าชั้น เซลล์หยิบ-เก็บ พร้อมศูนย์ควบคุมฝูงหุ่นยนต์และการบำรุงรักษาเชิงพยากรณ์':'An automated warehouse: container unloading, palletizing, FMR forklift put-away, a pick & stow cell, plus fleet control and predictive maintenance.',
   note:th?'แบบจำลองเพื่อสำรวจแนวคิด ไม่ใช่ข้อมูลจากระบบจริง ต้องมีอินเทอร์เน็ตเพื่อโหลด three.js และฟอนต์':'Models for exploring ideas, not live system data. An internet connection is needed to load three.js and fonts.'
  };
  const pages=[
   ['Control Center.dc.html','Control Center',th?'รวมมุมมอง Fleet · Warehouse · Maintenance ในหน้าเดียว แบ่งจอได้':'Fleet, warehouse and maintenance views in one place, with split view',th?'เริ่มที่นี่':'START HERE',1],
   ['Warehouse Floor.html','Warehouse Floor',th?'ลานคลัง 3 มิติ: ท่าลงของ → เครื่องจัดพาเลท → FMR เก็บเข้าชั้น':'3D floor: dock unloading → palletizer → FMR put-away','3D'],
   ['Fleet Orchestrator.dc.html','Fleet Orchestrator',th?'ฝูงหุ่นยนต์ ROS 2: กล้อง LiDAR หัวข้อสื่อสาร บันทึก':'ROS 2 fleet: vision, LiDAR, topics, logs','DASHBOARD'],
   ['Predictive Maintenance.dc.html','Predictive Maintenance',th?'ความล้า ความแม่นยำ การสั่นสะเทือน ใบสั่งงานซ่อม':'Fatigue, accuracy, vibration, work orders','DASHBOARD'],
   ['Unloading Robot Simulation.html','Container Unloading Robot',th?'จำลองหุ่นยนต์ลงของจากตู้คอนเทนเนอร์':'Container unloading robot simulation','3D'],
   ['Pick Stow Cell.html','Pick & Stow Cell',th?'เซลล์หยิบ-เก็บแบบทำงานร่วมกับคน':'Collaborative pick and stow cell','3D'],
   ['FMR Forklift Robot.html','FMR Forklift Robot',th?'หุ่นยนต์โฟล์คลิฟต์ 1.5 ตัน เสา 2.2 ม. ดาวน์โหลด OBJ/GLB ได้':'1.5 t forklift mobile robot, 2.2 m mast, OBJ/GLB download','3D']
  ];
  for(const n of document.querySelectorAll('[data-t]'))n.textContent=text[n.dataset.t];
  document.title=text.title+' — Transportation Systems';
  const grid=document.getElementById('grid');
  for(const [file,name,desc,kind,main] of pages){
   const a=document.createElement('a');a.className='card'+(main?' main':'');a.href=encodeURI(file);
   a.innerHTML='<b></b><span></span><div class="kind"></div>';
   a.children[0].textContent=name;a.children[1].textContent=desc;a.children[2].textContent=kind;grid.append(a);
  }
 })();
 </script>
</body>
</html>

<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="../shared/project-language.js?v=1.4.2" data-bilingual="true"></script>
<title>Incident Response Simulator</title>
<meta name="description" content="จำลองแผนช่วยเหลือหลังเกิดเหตุแบบ 3D ทุกโหมดการขนส่ง พร้อมจับเวลาแต่ละช่วง ชั่วโมงทอง การสืบสวน และการปรับมาตรฐาน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}
/* Layout: dispatch console. Incident + response choices on the left, live 3D scene with the phase clock on the right; phase timers, a log-time chart and the investigation/standards panel below */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#16202b; --muted:#5a6878; --line:#d5dce4; --tag-bg:#e8edf2;
  --accent:#e2640f; --ok:#2e7d32; --warn:#b3261e; --amber:#b07a00;
  --s-base:#2a6fb5; --s-now:#e2640f;
  --g-emer:#b3261e; --g-rec:#b07a00; --g-learn:#2a6fb5;
  --f-display:"Barlow Condensed","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#17202a; --ink:#e6ecf2; --muted:#9aa8b6; --line:#2a3644; --tag-bg:#1f2a36;
  --accent:#ff8a3d; --ok:#6fcf73; --warn:#ff7b72; --amber:#e0ad3a; --s-base:#4a90d9; --s-now:#d4621a;
  --g-emer:#ff7b72; --g-rec:#e0ad3a; --g-learn:#6aa8ec; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#17202a; --ink:#e6ecf2; --muted:#9aa8b6; --line:#2a3644; --tag-bg:#1f2a36;
  --accent:#ff8a3d; --ok:#6fcf73; --warn:#ff7b72; --amber:#e0ad3a; --s-base:#4a90d9; --s-now:#d4621a;
  --g-emer:#ff7b72; --g-rec:#e0ad3a; --g-learn:#6aa8ec; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:26px}
.wrap>*{min-width:0}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:14px}
header.top>div{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-size:clamp(32px,5.5vw,52px);line-height:1.05;margin:6px 0 8px;text-wrap:balance}
.lede{color:var(--muted);max-width:68ch;margin:0}
h2{font-family:var(--f-display);font-size:26px;line-height:1.1;margin:0 0 10px;text-wrap:balance}
.lbl{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:block}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{font:600 14px var(--f-mono);padding:7px 16px;background:transparent;color:var(--ink);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
.links a{color:var(--ink)}
.console{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.console{grid-template-columns:1fr}}
.setup{background:var(--panel);border:1px solid var(--line);padding:16px;display:grid;gap:15px}
select{font:inherit;width:100%;padding:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px}
.tg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.tg button{font:600 13px var(--f-body);padding:8px 6px;border:0;background:var(--bg);color:var(--ink);cursor:pointer;line-height:1.3}
.tg button+button{border-left:1.5px solid var(--line)}
.tg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.range{display:grid;gap:2px}
.range output{font:600 15px var(--f-mono);font-variant-numeric:tabular-nums}
.range input{width:100%;accent-color:var(--accent)}
.note{font-size:12.5px;color:var(--muted);margin:0}
.stage{display:grid;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);padding:14px;min-width:0}
.views{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.views button{font:600 13px var(--f-body);padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.v3wrap{position:relative;border-radius:6px;overflow:hidden;background:#0a1018}
#v3 canvas{touch-action:none;cursor:grab}
#v3 canvas:active{cursor:grabbing}
.orb{position:absolute;right:10px;bottom:10px;display:grid;gap:6px}
.orb button{width:40px;height:40px;border-radius:10px;border:0;background:rgba(10,16,24,.72);color:#fff;font:700 20px var(--f-mono);cursor:pointer;line-height:1}
.orb button:hover{background:rgba(10,16,24,.9)}
.orbhint{position:absolute;left:10px;bottom:10px;right:60px;font:12px var(--f-body);color:#fff;pointer-events:none}
.orbhint span{background:rgba(10,16,24,.55);padding:3px 9px;border-radius:999px}
.jumps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.jumps button{font:600 13.5px var(--f-body);padding:8px 12px;border-radius:8px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
.jumps button.crash{border-color:var(--warn);color:var(--warn)}
.tl{width:100%;accent-color:var(--accent);margin-top:8px}
.btn.go{font-size:16px;padding:12px 22px;background:var(--accent);border-color:var(--accent);color:#fff}
.modesw{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.modesw>*{display:grid;gap:2px;padding:12px 16px;color:var(--ink);text-decoration:none;min-width:0}
.modesw>*+*{border-left:2px solid var(--ink)}
.modesw small{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.modesw b{font:700 21px var(--f-display);line-height:1.15}
.modesw .on{background:var(--ink);color:var(--bg)} .modesw .on small{color:var(--bg);opacity:.75}
.modesw a:hover{background:var(--tag-bg)} .modesw a.fwd b::after{content:" →";color:var(--accent)} .modesw a.bwd b::before{content:"← ";color:var(--accent)}
@media (max-width:560px){.modesw b{font-size:17px}.modesw>*{padding:10px 12px}}

#v3 canvas{display:block;width:100%}
.clock{position:absolute;left:10px;top:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:none}
.clock span{font:600 12.5px var(--f-mono);color:#fff;background:rgba(10,16,24,.66);padding:4px 10px;border-radius:999px;font-variant-numeric:tabular-nums}
.clock .big{font-size:16px}
.clock .gh.ok{background:rgba(46,125,50,.85)} .clock .gh.bad{background:rgba(179,38,30,.85)}
.no3d{color:#e6ecf2;padding:40px 16px;text-align:center;margin:0}
.capt{font-size:13px;color:var(--muted);margin:8px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font:600 14px var(--f-body);padding:9px 16px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.kpi{border-left:3px solid var(--line);padding:2px 0 2px 10px;font-size:13px;color:var(--muted)}
.kpi b{display:block;font:700 23px var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.kpi small{display:block;font:12px var(--f-mono)}
.kpi.good{border-left-color:var(--ok)} .kpi.bad{border-left-color:var(--warn)}
.phases{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.phases li{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-left:4px solid var(--gc);background:var(--bg);font-size:13.5px}
.phases li .bar{height:6px;background:var(--tag-bg);border-radius:3px;overflow:hidden}
.phases li .bar i{display:block;height:100%;width:0;background:var(--gc)}
.phases li .t{font:600 12.5px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;min-width:9ch}
.phases li.now{background:var(--tag-bg);font-weight:600}
.phases li.done .nm::after{content:" ✓";color:var(--ok)}
.phases .grp{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 0 4px;border:0;background:none;display:block}
.chartwrap{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:560px;height:auto}
.chart text{font-family:var(--f-mono);fill:var(--muted);font-size:11px}
.chart .rowlbl{fill:var(--ink);font-family:var(--f-body);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;margin:4px 0 8px}
.legend span::before{content:"";display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:6px;background:var(--k)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font:12.5px var(--f-body);padding:6px 9px;border-radius:6px;max-width:260px;z-index:20}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fix{border-top:3px solid var(--fc);padding:10px 0 0;font-size:14px}
.fix h3{margin:0 0 4px;font-size:15px}
.fix p{margin:0;color:var(--muted)}
.inv{font-size:14px;margin:0 0 12px}
.inv b{font-family:var(--f-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:block}
.case{font-size:13.5px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--tag-bg);margin-top:12px}
.src{font-size:13px;color:var(--muted);columns:2 320px;margin:0;padding-left:18px}
.src a{color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line)}
.tbl td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
details summary{cursor:pointer;font-size:13.5px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div class="wrap">
 <header class="top">
  <div>
   <div class="eyebrow" data-i="eyebrow"></div>
   <h1 data-i="title"></h1>
   <p class="lede" data-i="lede"></p>
  </div>
  <div style="display:grid;gap:10px;justify-items:end">
   <div class="links"><a id="lk-board" href="./index.html" data-i="lkBoard"></a><a id="lk-sim" href="./simulator.html" data-i="lkSim"></a></div>
  </div>
 </header>
 <nav class="modesw" aria-label="Before / after the crash"><a class="bwd" id="sw-sim" href="./simulator.html"><small data-i="swStep1"></small><b data-i="swSim"></b></a><span class="on" aria-current="page"><small data-i="swStep2"></small><b data-i="swResp"></b></span></nav>

 <div class="console">
  <div class="setup">
   <div><label class="lbl" for="inc" data-i="lInc"></label><select id="inc"></select><p class="note" id="inc-d" style="margin-top:6px"></p></div>
   <div><span class="lbl" data-i="lNotify"></span><div class="tg" role="group" id="tg-auto"><button type="button" id="auto-0" data-k="auto" data-v="0"></button><button type="button" id="auto-1" data-k="auto" data-v="1"></button></div></div>
   <div><span class="lbl" data-i="lTeam"></span><div class="tg" role="group" id="tg-robots"><button type="button" id="robots-0" data-k="robots" data-v="0"></button><button type="button" id="robots-1" data-k="robots" data-v="1"></button></div><p class="note" id="robot-d" style="margin-top:6px"></p></div>
   <div><span class="lbl" data-i="lPeople"></span><div class="tg" role="group" id="tg-trained"><button type="button" id="trained-0" data-k="trained" data-v="0"></button><button type="button" id="trained-1" data-k="trained" data-v="1"></button></div></div>
   <div class="range"><label class="lbl" for="dist" data-i="lDist" style="margin:0"></label><output id="dist-o"></output><input type="range" id="dist" min="1" max="120" step="1" value="5"></div>
   <p class="note" data-i="noteModel"></p>
  </div>

  <div class="stage">
   <div class="card">
    <div class="views" id="views" role="group" aria-label="View"></div>
    <div class="v3wrap" id="v3wrap"><div id="v3"></div>
     <div class="clock"><span class="big" id="ck-t">T+ 00:00</span><span id="ck-ph"></span><span class="gh" id="ck-gh"></span><span id="ck-sea" hidden></span></div>
     <div class="orb"><button type="button" data-orb="in" aria-label="Zoom in">+</button><button type="button" data-orb="out" aria-label="Zoom out">−</button><button type="button" data-orb="reset" aria-label="Reset view">⟲</button></div><div class="orbhint" id="orbhint"><span></span></div>
    </div>
    <p class="capt" id="capt"></p>
    <input class="tl" type="range" id="rtl" min="0" max="1000" value="0" aria-label="Timeline">
    <div class="jumps" role="group"><button type="button" class="crash" data-rj="t0" data-i="rj0"></button><button type="button" data-rj="arr" data-i="rj1"></button><button type="button" data-rj="hosp" data-i="rj2"></button><button type="button" data-rj="open" data-i="rj3"></button><button type="button" data-rj="fix" data-i="rj4"></button></div>
    <div class="btns">
     <button class="btn go" type="button" id="play" data-i="play"></button>
     <button class="btn ghost" type="button" id="reroll" data-i="reroll"></button>
    </div>
   </div>
   <div class="kpis" id="kpis"></div>
  </div>
 </div>

 <section class="card">
  <h2 data-i="hPhases"></h2>
  <p class="note" data-i="phNote" style="margin-bottom:8px"></p>
  <ul class="phases" id="phases"></ul>
 </section>

 <section class="card">
  <h2 data-i="hChart"></h2>
  <div class="legend"><span style="--k:var(--s-base)" data-i="lgBase"></span><span style="--k:var(--s-now)" data-i="lgNow"></span></div>
  <div class="chart chartwrap" id="chart"></div>
  <details style="margin-top:8px"><summary data-i="tblSum"></summary><div class="chartwrap"><table class="tbl" id="tbl"></table></div></details>
 </section>

 <section class="card">
  <h2 data-i="hLearn"></h2>
  <p class="inv" id="inv"></p>
  <div class="grid4" id="fixes"></div>
  <div class="case" id="case"></div>
 </section>

 <section>
  <h2 data-i="hSrc" style="font-size:20px"></h2>
  <ol class="src" id="src"></ol>
 </section>
</div>
<div class="tip" id="tip" hidden></div>

<script>
const $=id=>document.getElementById(id);
let lang=(globalThis.ProjectLanguage&&ProjectLanguage.language)==="en"?"en":"th";
const tx=o=>o?(o[lang]??o.en??""):"";
const B=(th,en)=>({th,en});
const BOARD_URL="./index.html", SIM_URL="./simulator.html";

 eyebrow:B("กระดานความปลอดภัยการขนส่ง · แผนช่วยเหลือ","Transport Safety Board · Response"),

 lkBoard:B("← กระดานความปลอดภัย","← Safety board"),lkSim:B("ตัวจำลองการขับขี่ →","Driving simulator →"),

 const scene=U(r,I.scene)*(c.robots?.9:1);
 const reopen=U(r,I.reopen);
 f.det=[0,det];f.self=[0,self];f.disp=[det,t1];f.trav=[t1,arr];f.acc=[arr,arr+acc];f.care=[arr+acc,arr+acc+care];
 f.scene=[arr+acc,arr+acc+scene];f.reopen=[arr+acc+scene,arr+acc+scene+reopen];
 const pre=U(r,I.prelim),fin=U(r,I.final),fx=U(r,I.fix);
 f.prelim=[0,pre];f.final=[0,fin];f.fix=[fin,fin+fx];
 const drone=c.robots?det+1.5+c.dist/60*60:Infinity;
 return {f,arr,drone,first:Math.min(arr,drone,c.trained&&c.inc==="ped"?self:Infinity),hosp:arr+acc+care,open:f.reopen[1],fixEnd:f.fix[1],accEnd:arr+acc};
}

 $("inv").innerHTML=`<b>${esc(tx(T.invBy))}</b>${esc(tx(I.inv))}`;
 const heads=[T.fxV,T.fxS,T.fxP,T.fxY],cols=["var(--accent)","var(--g-rec)","var(--ok)","var(--g-learn)"];
 $("fixes").innerHTML=I.fx.map((x,i)=>`<div class="fix" style="--fc:${cols[i]}"><h3>${esc(tx(heads[i]))}</h3><p>${esc(tx(x))}</p></div>`).join("");
 $("case").textContent=tx(I.cs);}

/* ---------- UI ---------- */
function syncViews(){const ok=has3D();$("views").innerHTML=[["over",T.vOver],["team",T.vTeam],["vic",T.vVic]].map(([k,l])=>`<button type="button" id="view-${k}" data-view="${k}" aria-pressed="${st.view===k}" ${ok?"":"disabled"}>${esc(tx(l))}</button>`).join("");
 $("capt").textContent=ok?tx(st.view==="over"?T.capOver:st.view==="team"?T.capTeam:T.capVic):"";
 if(!ok&&!$("no3d")){$("v3").innerHTML=`<p class="no3d" id="no3d">${esc(tx(T.no3d))}</p>`;}}
function setup(){
 $("inc").innerHTML=Object.keys(INC).map(k=>`<option value="${k}">${esc(tx(INC[k].n))}</option>`).join("");$("inc").value=st.inc;$("inc-d").textContent=tx(INC[st.inc].d);
 [["auto",T.aut0,T.aut1],["robots",T.rob0,T.rob1],["trained",T.tr0,T.tr1]].forEach(([k,a,b])=>{$(k+"-0").textContent=tx(a);$(k+"-1").textContent=tx(b);$(k+"-0").setAttribute("aria-pressed",!st[k]);$(k+"-1").setAttribute("aria-pressed",!!st[k]);});
 $("robot-d").textContent=tx(T.droneRole)+tx(INC[st.inc].robots);
 $("dist").value=st.dist;$("dist-o").textContent=st.dist+(lang==="th"?" กม.":" km");}
function recompute(){RUN=compute(cfg(),rng(st.seed*7919+1));MC=monte(cfg());MB=monte({...cfg(),auto:false,robots:false,trained:false});
 kpis();chart();learn();if(has3D()){size3d();build();}u0=0;lastT=0;$("rtl").value=0;orbReset();playing=false;cancelAnimationFrame(anim);$("play").textContent=tx(T.play);drawClock(0);drawPhases(0);}
function render(){document.documentElement.lang=lang;document.querySelectorAll("[data-i]").forEach(el=>el.textContent=tx(T[el.dataset.i]));
 document.title=tx(T.title);
 $("lk-board").href=BOARD_URL;$("lk-sim").href=SIM_URL;$("sw-sim").href=SIM_URL;{const h=document.querySelector("#orbhint span");if(h)h.textContent=tx(T.orbHint);}
 $("src").innerHTML=SRC.map(([t,u])=>`<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`).join("");
 setup();syncViews();recompute();}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.dataset.k){st[b.dataset.k]=+b.dataset.v;setup();recompute();}
 else if(b.dataset.view){orbReset();st.view=b.dataset.view;syncViews();}
 else if(b.dataset.rj){const R=RUN,k=b.dataset.rj;setU(uOf(k==="t0"?0:k==="arr"?R.arr+.2:k==="hosp"?R.hosp:k==="open"?R.open:R.fixEnd));}
 else if(b.id==="play")play();
 else if(b.id==="reroll"){st.seed=(st.seed*48271)%2147483647||5;recompute();play();}});
document.addEventListener("change",e=>{if(e.target.id==="inc"){st.inc=e.target.value;st.dist=INC[st.inc].dist;setup();recompute();}});
document.addEventListener("input",e=>{if(e.target.id==="rtl"){setU(+e.target.value/1000);return;}if(e.target.id==="dist"){st.dist=+e.target.value;$("dist-o").textContent=st.dist+(lang==="th"?" กม.":" km");clearTimeout(window._dt);window._dt=setTimeout(recompute,150);}});
window.addEventListener("resize",()=>{size3d();});
{const h=location.hash.slice(1);if(INC[h]){st.inc=h;st.dist=INC[h].dist;}}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(INC[h]&&h!==st.inc){st.inc=h;st.dist=INC[h].dist;setup();recompute();}});
render();requestAnimationFrame(idle);
</script>

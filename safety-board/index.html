<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script src="../shared/project-language.js?v=1.4.2" data-bilingual="true"></script>
<title>Transport Safety Board</title>
<meta name="description" content="บอร์ดสรุปมาตรฐานความปลอดภัยยานพาหนะทุกโหมด หน่วยสอบสวน ระดับรถอัตโนมัติ ใบอนุญาตขับขี่ และจุดเปลี่ยนสำคัญ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0}
/* Layout: investigator's case board — header + jump index, recap tiles, loop, org matrix, timeline, road / space / autonomy / licensing sections, layers, sources */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#16202b; --muted:#5a6878; --line:#d5dce4;
  --accent:#e2640f; --accent-ink:#ffffff;
  --air:#2a6fb5; --sea:#0f8a83; --rail:#b07a00; --rotor:#7b4fbf; --road:#4d7c0f; --space:#3346a8; --all:#3d4a58;
  --tag-bg:#e8edf2; --warn:#b3261e; --ok:#2e7d32;
  --asphalt:#cfd6de; --curb:#eef1f4; --stripe:#ffffff; --occl:#5a6878;
  --f-display:"Barlow Condensed","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#17202a; --ink:#e6ecf2; --muted:#9aa8b6; --line:#2a3644;
  --accent:#ff8a3d; --accent-ink:#1a0f05;
  --air:#6aa8ec; --sea:#3cc2b8; --rail:#e0ad3a; --rotor:#a988e6; --road:#9ccc4a; --space:#8fa2ff; --all:#b8c4d0;
  --tag-bg:#1f2a36; --warn:#ff7b72; --ok:#6fcf73;
  --asphalt:#2b3642; --curb:#1c252f; --stripe:#cfd6de; --occl:#05080b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#17202a; --ink:#e6ecf2; --muted:#9aa8b6; --line:#2a3644;
  --accent:#ff8a3d; --accent-ink:#1a0f05;
  --air:#6aa8ec; --sea:#3cc2b8; --rail:#e0ad3a; --rotor:#a988e6; --road:#9ccc4a; --space:#8fa2ff; --all:#b8c4d0;
  --tag-bg:#1f2a36; --warn:#ff7b72; --ok:#6fcf73;
  --asphalt:#2b3642; --curb:#1c252f; --stripe:#cfd6de; --occl:#05080b; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:44px}
.wrap>*{min-width:0}
section{scroll-margin-top:16px}
header.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:16px}
header.top>div{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-size:clamp(34px,6vw,58px);line-height:1.05;margin:6px 0 8px;letter-spacing:.01em;text-wrap:balance}
.lede{color:var(--muted);max-width:62ch;margin:0}
h2{font-family:var(--f-display);font-size:30px;line-height:1.1;margin:0 0 6px;text-wrap:balance}
h4{margin:0 0 8px;font-size:13px;font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec-sub{color:var(--muted);margin:0 0 18px;max-width:72ch}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{font:600 14px var(--f-mono);padding:7px 16px;background:transparent;color:var(--ink);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.jump{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:-28px;font-size:13.5px}
.jump a{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--line);padding:2px 0}
.jump a:hover{border-bottom-color:var(--accent)}

/* recap */
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.rc{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c,var(--all));padding:14px 16px;display:grid;gap:6px;align-content:start;min-width:0}
.rc .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--all))}
.rc h3{margin:0;font-size:16px;line-height:1.35}
.rc p{margin:0;color:var(--muted);font-size:14px}
.rc.case{grid-column:1/-1;border-top-color:var(--accent);gap:10px}
.case-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 20px}
.case-grid div{min-width:0}
.case-grid b{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.status{display:inline-block;font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--warn);border:1px solid var(--warn);padding:1px 8px;border-radius:999px;justify-self:start}

/* loop + pipelines */
.loop{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;counter-reset:s}
.loop li{background:var(--panel);border:1px solid var(--line);padding:14px;position:relative;counter-increment:s;min-width:0}
.loop li::before{content:counter(s);font:700 26px var(--f-display);color:var(--accent);display:block;line-height:1}
.loop li:not(:last-child)::after{content:"→";position:absolute;right:-12px;top:14px;font-weight:700;color:var(--muted);background:var(--bg);padding:0 1px;z-index:1}
.loop h3{margin:4px 0 4px;font-size:15px}
.loop p{margin:0;font-size:13.5px;color:var(--muted)}
.loop.pipe li::before{color:var(--road)}
.loop-back{margin-top:10px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.principles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:16px}
.principles div{border-left:3px solid var(--ink);padding:2px 0 2px 12px;min-width:0}
.principles b{display:block}
.principles span{color:var(--muted);font-size:14px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{font:600 13px var(--f-body);padding:6px 14px;border-radius:999px;border:1.5px solid var(--c,var(--all));background:transparent;color:var(--c,var(--all));cursor:pointer}
.chip[aria-pressed="true"]{background:var(--c,var(--all));color:var(--bg)}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:780px;font-size:14px}
th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
thead th{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--tag-bg)}
tbody th{font-family:var(--f-display);font-size:19px;white-space:nowrap;border-left:4px solid var(--c)}
.code{font-family:var(--f-mono);font-size:12.5px;background:var(--tag-bg);padding:1px 6px;border-radius:4px;white-space:nowrap;display:inline-block;margin:1px 0}
td ul{margin:0;padding-left:16px}

/* timeline */
.tl{position:relative;display:grid;gap:12px;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.ev{position:relative;background:var(--panel);border:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:92px 1fr;gap:4px 14px;min-width:0}
.ev::before{content:"";position:absolute;left:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px var(--bg)}
.ev .yr{font:700 24px var(--f-display);line-height:1;color:var(--c);font-variant-numeric:tabular-nums}
.ev .mode{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.ev h3{margin:0;font-size:15.5px;line-height:1.35}
.ev .body{min-width:0;display:grid;gap:6px}
.ev .chg{font-size:14px}
.ev .chg::before{content:"⟶ ";color:var(--accent);font-weight:700}
.ev .what{font-size:14px;color:var(--muted);margin:0}
.ev.open{border-color:var(--accent);border-style:dashed}
.era{font:700 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 0 -22px;padding-left:22px}

/* road */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:18px}
.stat{border-left:4px solid var(--road);padding:4px 0 4px 14px;min-width:0}
.stat b{display:block;font:700 34px var(--f-display);line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:13.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0}
.card h3{margin:0 0 8px;font-size:16px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card h3 small{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c,var(--road))}
.card p{margin:0 0 8px;font-size:14px;color:var(--muted)}
.pl{display:grid;gap:5px;margin:0;padding:0;list-style:none;font-size:14px}
.pl li{display:grid;grid-template-columns:18px 1fr;gap:6px}
.pl li::before{font-weight:700;font-family:var(--f-mono)}
.pl.risk li::before{content:"!";color:var(--warn)}
.pl.help li::before{content:"+";color:var(--ok)}
.pl.con li::before{content:"–";color:var(--warn)}
.sub{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 4px}
.veh{border-top:4px solid var(--c)}

/* autonomy ladder */
.ladder{display:grid;gap:6px}
.lv{display:grid;grid-template-columns:64px 1.3fr 1fr 1fr 1.2fr;gap:0;background:var(--panel);border:1px solid var(--line);align-items:stretch;min-width:0}
.lv>div{padding:10px 12px;font-size:14px;min-width:0;border-left:1px solid var(--line)}
.lv>div:first-child{border-left:0;font:700 26px var(--f-display);display:grid;place-items:center;color:var(--bg);background:color-mix(in srgb,var(--road) calc(var(--lvl)*18% + 10%),var(--muted))}
.lv.head{background:var(--tag-bg)}
.lv.head>div{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lv.head>div:first-child{background:transparent;color:var(--muted);font:600 11px var(--f-mono)}
.lv b{display:block}
.lv .who-sys{color:var(--road);font-weight:600}
.lv .who-hum{color:var(--accent);font-weight:600}
.lv-split{border-top:2px dashed var(--accent);margin:4px 0;position:relative}
.lv-split span{position:absolute;right:0;top:-11px;background:var(--bg);padding:0 8px;font:600 11px var(--f-mono);color:var(--accent);letter-spacing:.04em}
@media (max-width:760px){
  .lv{grid-template-columns:52px 1fr}
  .lv>div{border-left:0}
  .lv>div:first-child{grid-row:span 4}
  .lv>div:not(:first-child){padding:4px 12px}
  .lv>div:nth-child(2){padding-top:10px}
  .lv>div:last-child{padding-bottom:10px}
  .lv.head{display:none}
  .lv [data-l]::before{content:attr(data-l);display:block;font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
}
.mini-tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:16px}
.mini-tl div{border-top:2px solid var(--road);padding-top:6px;font-size:13.5px;min-width:0}
.mini-tl b{font:700 18px var(--f-display);display:block}

/* AV decision */
.dec{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.dec{grid-template-columns:1fr}}
.scene{background:var(--panel);border:1px solid var(--line);padding:10px}
.scene svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
.scene svg text{font-family:var(--f-body);fill:var(--ink)}
.cap{font-size:13px;color:var(--muted);margin:8px 2px 0}
.legend{display:grid;gap:8px;font-size:14px}
.legend div{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start}
.legend i{font-style:normal;font:700 13px var(--f-mono);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.demo{background:var(--panel);border:1px solid var(--line);padding:16px;margin-top:16px;display:grid;gap:14px}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.ctrls label{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
.ctrls output{font:600 15px var(--f-mono);color:var(--ink);font-variant-numeric:tabular-nums}
.ctrls input[type=range]{width:100%;accent-color:var(--accent)}
.ctrls select{font:inherit;padding:6px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px}
.bars{display:grid;gap:12px}
.bar{display:grid;gap:4px}
.bar .lab{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px}
.bar .lab b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.track{position:relative;height:22px;background:var(--tag-bg);border-radius:4px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;display:flex}
.fill .re{background:color-mix(in srgb,var(--muted) 55%,transparent)}
.fill .br{background:var(--ok)}
.fill.bad .br{background:var(--warn)}
.vis{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink)}
.verdict{font-size:14px;padding:10px 12px;border-left:4px solid var(--ok);background:var(--tag-bg)}
.verdict.bad{border-left-color:var(--warn)}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.keys span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px;background:var(--k)}

.simlink{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;margin-top:16px;padding:14px 16px;border:2px solid var(--ink);background:var(--panel);color:var(--ink);text-decoration:none}
.simlink b{font:700 22px var(--f-display)}
.simlink span{font-size:14px;color:var(--muted);max-width:60ch}
.simlink:hover{border-color:var(--accent)}
/* layers */
.layers{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.lyr{background:var(--panel);border:1px solid var(--line);padding:16px;min-width:0}
.lyr h3{margin:0 0 10px;font-size:16px}
.lyr ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.lyr li{display:grid;grid-template-columns:22px 1fr;gap:8px;font-size:14px;align-items:start}
.lyr .mk{font:700 13px var(--f-mono);text-align:center;border-radius:4px;line-height:20px}
.mk.ok{background:var(--tag-bg);color:var(--muted)}
.mk.x{background:var(--warn);color:var(--panel)}
.mk.q{border:1.5px dashed var(--warn);color:var(--warn);line-height:17px}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* sources */
.src{columns:2 320px;column-gap:28px;padding-left:22px;margin:0;font-size:14px}
.src li{break-inside:avoid;margin-bottom:6px}
.src a{color:var(--air);text-decoration-thickness:1px;text-underline-offset:2px;word-break:break-word}
.src .tag{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}

@media (max-width:860px){
  .loop{grid-template-columns:1fr}
  .loop li:not(:last-child)::after{content:"↓";right:auto;left:14px;top:auto;bottom:-14px}
}
@media (max-width:520px){
  .ev{grid-template-columns:1fr}
  h2{font-size:26px}
  .jump{margin-top:-30px}
}
@media (prefers-reduced-motion:no-preference){.fill>*{transition:width .25s}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow" data-i="eyebrow"></div>
      <h1 data-i="title"></h1>
      <p class="lede" data-i="lede"></p>
    </div>
  </header>
  <nav class="jump" id="jump" aria-label="Sections"></nav>

  <section id="recap-sec">
    <h2 data-i="s1"></h2>
    <p class="sec-sub" data-i="s1sub"></p>
    <div class="recap" id="recap"></div>
  </section>

  <section id="loop-sec">
    <h2 data-i="s2"></h2>
    <p class="sec-sub" data-i="s2sub"></p>
    <ol class="loop" id="loop"></ol>
    <div class="loop-back" data-i="loopback"></div>
    <div class="principles" id="principles"></div>
  </section>

  <section id="orgs-sec">
    <h2 data-i="s3"></h2>
    <p class="sec-sub" data-i="s3sub"></p>
    <div class="tbl-wrap"><table>
      <thead><tr><th data-i="thMode"></th><th data-i="thGlobal"></th><th data-i="thInv"></th><th data-i="thReg"></th><th data-i="thStd"></th></tr></thead>
      <tbody id="orgs"></tbody>
    </table></div>
  </section>

  <section id="timeline-sec">
    <h2 data-i="s4"></h2>
    <p class="sec-sub" data-i="s4sub"></p>
    <div class="chips" id="chips" role="group" aria-label="Filter"></div>
    <div class="tl" id="tl"></div>
  </section>

  <section id="road-sec">
    <h2 data-i="sRoad"></h2>
    <p class="sec-sub" data-i="sRoadSub"></p>
    <div class="stats" id="stats"></div>
    <div class="grid2" id="env"></div>
    <h4 style="margin-top:22px" data-i="vehHead"></h4>
    <div class="grid2" id="veh"></div>
  </section>

  <section id="space-sec">
    <h2 data-i="sSpace"></h2>
    <p class="sec-sub" data-i="sSpaceSub"></p>
    <div class="grid2" id="space"></div>
  </section>

  <section id="levels-sec">
    <h2 data-i="sLv"></h2>
    <p class="sec-sub" data-i="sLvSub"></p>
    <div class="ladder" id="ladder"></div>
    <div class="mini-tl" id="avtl"></div>
  </section>

  <section id="decide-sec">
    <h2 data-i="sDec"></h2>
    <p class="sec-sub" data-i="sDecSub"></p>
    <ol class="loop pipe" id="pipe"></ol>
    <div class="dec" style="margin-top:16px">
      <figure class="scene" style="margin:0"><div id="scene"></div><figcaption class="cap" data-i="sceneCap"></figcaption></figure>
      <div class="legend" id="legend"></div>
    </div>
    <div class="demo">
      <div><h3 style="margin:0 0 4px;font-size:17px" data-i="demoH"></h3><p class="cap" style="margin:0" data-i="demoP"></p></div>
      <div class="ctrls">
        <label for="dm-speed"><span data-i="dmSpeed"></span><output id="dm-speed-o"></output><input id="dm-speed" type="range" min="10" max="120" step="5" value="50"></label>
        <label for="dm-vis"><span data-i="dmVis"></span><output id="dm-vis-o"></output><input id="dm-vis" type="range" min="5" max="150" step="5" value="30"></label>
        <label for="dm-road"><span data-i="dmRoad"></span><select id="dm-road"></select></label>
      </div>
      <div class="bars" id="bars"></div>
      <div class="keys" id="keys"></div>
      <div class="verdict" id="verdict"></div>
    </div>
    <a class="simlink" id="sim-link" href="./simulator.html"><div><b data-i="simH"></b><br><span data-i="simP"></span></div><b aria-hidden="true">→</b></a>
    <h4 style="margin-top:22px" data-i="trainHead"></h4>
    <ol class="loop" id="train"></ol>
    <div class="grid2" style="margin-top:14px" id="uncert"></div>
  </section>

  <section id="license-sec">
    <h2 data-i="sLic"></h2>

  <div class="track"><div class="fill${bad?" bad":""}" style="width:${(c.tot/scale*100).toFixed(1)}%"><span class="re" style="width:${(c.re/c.tot*100).toFixed(1)}%"></span><span class="br" style="width:${(c.br/c.tot*100).toFixed(1)}%"></span></div><span class="vis" style="left:${(d/scale*100).toFixed(1)}%"></span></div></div>`;}).join("");

 document.querySelectorAll("[data-i]").forEach(el=>{el.textContent=tx(T[el.dataset.i])});
 document.title=tx(T.title);
 document.getElementById("jump").innerHTML=JUMP.map(([id,k])=>`<a href="#${id}">${esc(tx(T[k]))}</a>`).join("")+`<a href="${SIM_URL}" style="border-bottom-color:var(--accent)">${esc(tx(T.jSim))}</a>`;

 document.getElementById("recap").innerHTML=
  `<article class="rc case"><span class="k" style="color:var(--accent)">${esc(tx(CASE.k))}</span><h3>${esc(tx(CASE.h))}</h3>
   <div class="case-grid">${CASE.rows.map(r=>`<div><b>${esc(tx(r[0]))}</b>${esc(tx(r[1]))}</div>`).join("")}</div>
   <span class="status">${lang==="th"?"อยู่ระหว่างสอบสวน · NTSB":"Under investigation · NTSB"}</span></article>`+
  RECAP.map(r=>`<article class="rc" style="--c:${col(r.m)}"><span class="k">${esc(tx(r.k))}</span><h3>${esc(tx(r.h))}</h3><p>${esc(tx(r.p))}</p></article>`).join("");

 const steps=a=>a.map(s=>`<li><h3>${esc(tx(s.h))}</h3><p>${esc(tx(s.p))}</p></li>`).join("");
 document.getElementById("loop").innerHTML=steps(LOOP);
 document.getElementById("principles").innerHTML=PRIN.map(p=>`<div><b>${esc(tx(p.h))}</b><span>${esc(tx(p.p))}</span></div>`).join("");

 const list=a=>`<ul>${a.map(x=>`<li>${esc(tx(x))}</li>`).join("")}</ul>`;
 document.getElementById("orgs").innerHTML=ORGS.map(o=>`<tr><th style="--c:${col(o.m)}">${esc(tx(M[o.m]))}</th><td>${esc(tx(o.g))}</td><td>${list(o.i)}</td><td>${list(o.r)}</td><td>${o.s.map(s=>`<span class="code">${esc(s)}</span>`).join(" ")}</td></tr>`).join("");

 const modes=["all","road","rail","sea","air","rotor","space"];
 document.getElementById("chips").innerHTML=modes.map(m=>`<button type="button" class="chip" id="chip-${m}" data-m="${m}" style="--c:${col(m)}" aria-pressed="${filt===m}">${esc(m==="all"?tx(T.all):tx(M[m]))}</button>`).join("");
 let out="", pendingEra=null;
 EV.forEach(e=>{
  if(e.era){pendingEra=e.era;return;}
  if(filt!=="all" && e.m!==filt && e.m!=="all") return;
  if(pendingEra){out+=`<div class="era">${esc(tx(pendingEra))}</div>`;pendingEra=null;}
  out+=`<article class="ev${e.open?" open":""}" style="--c:${col(e.m)}"><div><div class="yr">${e.y}</div><div class="mode">${esc(modeName(e.m))}</div></div>
   <div class="body"><h3>${esc(tx(e.h))}</h3><p class="what">${esc(tx(e.w))}</p><div class="chg">${esc(tx(e.c))}</div></div></article>`;
 });
 document.getElementById("tl").innerHTML=out;

 document.getElementById("stats").innerHTML=STATS.map(s=>`<div class="stat"><b>${esc(s.b)}</b><span>${esc(tx(s.t))}</span></div>`).join("");
 document.getElementById("env").innerHTML=ENV.map(e=>`<div class="card"><h3>${esc(tx(e.h))}<small>${esc(tx(e.k))}</small></h3><p>${esc(tx(e.p))}</p><div class="sub">${esc(tx(T.risks))}</div>${ul(e.r,"risk")}<div class="sub">${esc(tx(T.helps))}</div>${ul(e.g,"help")}</div>`).join("");
 document.getElementById("veh").innerHTML=VEH.map(v=>`<div class="card veh" style="--c:${v.c}"><h3>${esc(tx(v.h))}</h3><div class="sub" style="margin-top:0">${esc(tx(T.pros))}</div>${ul(v.p,"help")}<div class="sub">${esc(tx(T.cons))}</div>${ul(v.n,"con")}</div>`).join("");

 document.getElementById("space").innerHTML=SPACE.map(s=>`<div class="card" style="--c:var(--space);border-top:4px solid var(--space)"><h3>${esc(tx(s.h))}</h3><p>${esc(tx(s.p))}</p>${ul([s.g],"help")}</div>`).join("");

 const who=k=>k==="h"?`<span class="who-hum">${lang==="th"?"คน":"Human"}</span>`:k==="s"?`<span class="who-sys">${lang==="th"?"ระบบ":"System"}</span>`:`<span class="who-hum">${lang==="th"?"คน":"Human"}</span> + <span class="who-sys">${lang==="th"?"ระบบช่วย":"system helps"}</span>`;
 const H=T.lvH.map(tx);
 document.getElementById("ladder").innerHTML=`<div class="lv head"><div>${esc(H[0])}</div><div>${esc(H[1])}</div><div>${esc(H[2])}</div><div>${esc(H[3])}</div><div>${esc(H[4])}</div></div>`+
  LV.map(l=>l.split?`<div class="lv-split"><span>${esc(tx(T.lvSplit))}</span></div>`:`<div class="lv" style="--lvl:${l.n}"><div>${l.n}</div><div data-l="${esc(H[1])}"><b>${esc(tx(l.h))}</b>${esc(tx(l.d))}</div><div data-l="${esc(H[2])}">${who(l.w)}</div><div data-l="${esc(H[3])}">${who(l.m)}</div><div data-l="${esc(H[4])}">${esc(tx(l.e))}</div></div>`).join("");
 document.getElementById("avtl").innerHTML=AVTL.map(a=>`<div><b>${esc(a.y)}</b>${esc(tx(a.t))}</div>`).join("");

 document.getElementById("pipe").innerHTML=steps(PIPE);
 document.getElementById("scene").innerHTML=scene();
 document.getElementById("legend").innerHTML=legend();
 const sel=document.getElementById("dm-road"),cur=sel.value||"wet";
 sel.innerHTML=["dry","wet","flood"].map(k=>`<option value="${k}">${esc(tx(T[k]))}</option>`).join(""); sel.value=cur;
 demo();
 document.getElementById("train").innerHTML=steps(TRAIN);
 document.getElementById("uncert").innerHTML=UNC.map(u=>`<div class="card" style="border-left:4px solid var(--road)"><h3>${esc(tx(u.h))}</h3><p style="margin:0">${esc(tx(u.p))}</p></div>`).join("");

 document.getElementById("lic").innerHTML=LIC.map(l=>`<tr><th style="--c:${col(l.m)}">${esc(l.av?(lang==="th"?"รถอัตโนมัติ":"Automated car"):tx(M[l.m]))}</th><td>${esc(tx(l.f))}</td><td>${esc(tx(l.c))}</td><td>${esc(tx(l.t))}</td></tr>`).join("");

 const mk={ok:"✓",x:"✕",q:"?"};
 document.getElementById("layers").innerHTML=LAYERS.map(L=>`<div class="lyr"><h3>${esc(tx(L.h))}</h3><ol>${L.l.map(([s,t])=>`<li><span class="mk ${s}">${mk[s]}</span><span>${esc(tx(t))}</span></li>`).join("")}</ol></div>`).join("");
 document.getElementById("src").innerHTML=SRC.map(s=>`<li><a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a> <span class="tag">· ${esc(s.g)}</span></li>`).join("");
}
document.addEventListener("click",ev=>{
 const b=ev.target.closest("button"); if(!b) return;
 if(b.dataset.m){filt=b.dataset.m; render(); document.getElementById("chip-"+filt)?.focus();}
});
document.addEventListener("input",ev=>{if(ev.target.closest(".demo"))demo();});
document.getElementById("dm-road").value="wet";
render();
</script>
</body>
</html>

<style>
*{box-sizing:border-box}body{margin:0}
/* Layout: drawing office. Vehicle tabs on top; the model or drawing sheet on the left, the parts list and the selected part's data sheet on the right; standards, limits and sources below */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#16202b; --muted:#5a6878; --line:#d5dce4; --tag-bg:#e8edf2;
  --accent:#e2640f; --ok:#2e7d32; --warn:#b3261e;
  --sheet:#0f3057; --sheet-fill:#18426f; --sheet-ink:#e9f2fb; --sheet-hot:#ffb347; --stage:#dfe6ec;
  --f-display:"Barlow Condensed","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --panel:#17202a; --ink:#e6ecf2; --muted:#9aa8b6; --line:#2a3644; --tag-bg:#1f2a36;
  --accent:#ff8a3d; --ok:#6fcf73; --warn:#ff7b72; --sheet:#0b2440; --sheet-fill:#143659; --sheet-ink:#e9f2fb; --sheet-hot:#ffb347; --stage:#1b2631; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --panel:#17202a; --ink:#e6ecf2; --muted:#9aa8b6; --line:#2a3644; --tag-bg:#1f2a36;
  --accent:#ff8a3d; --ok:#6fcf73; --warn:#ff7b72; --sheet:#0b2440; --sheet-fill:#143659; --sheet-ink:#e9f2fb; --sheet-hot:#ffb347; --stage:#1b2631; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:1220px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:grid;gap:22px}
.wrap>*{min-width:0}
header.top{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;border-bottom:3px solid var(--ink);padding-bottom:14px}
header.top>div{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--f-display);font-size:clamp(32px,5.5vw,52px);line-height:1.05;margin:6px 0 8px;text-wrap:balance}
.lede{color:var(--muted);max-width:70ch;margin:0}
h2{font-family:var(--f-display);font-size:26px;line-height:1.1;margin:0 0 10px;text-wrap:balance}
h3{font-size:16px;margin:0 0 4px}
.lbl{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;display:block}
.lang{display:inline-flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{font:600 14px var(--f-mono);padding:7px 16px;background:transparent;color:var(--ink);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.boardbtn{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--f-body);padding:9px 14px;border:2px solid var(--ink);border-radius:10px;color:var(--ink);background:var(--panel);text-decoration:none}
.boardbtn:hover{background:var(--ink);color:var(--bg)}
.vehs{display:flex;flex-wrap:wrap;gap:6px}
.vehs button{font:600 14px var(--f-body);padding:9px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.vehs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,360px);gap:16px;align-items:start}
@media (max-width:960px){.desk{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);padding:14px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{font:600 13px var(--f-body);padding:7px 14px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{font:600 13px var(--f-body);padding:7px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.view{position:relative;border-radius:6px;overflow:hidden;background:var(--stage)}
.view.sheet{background:var(--sheet)}
#gl canvas{display:block;width:100%;touch-action:none;cursor:grab}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;font-family:var(--f-mono)}
#ov text{fill:var(--sheet-ink);font-size:11px}
#ov .fr{fill:none;stroke:var(--sheet-ink);stroke-opacity:.35;stroke-width:1}
#ov .dim{stroke:var(--sheet-ink);stroke-width:1;fill:none}
#ov .ld{stroke:var(--sheet-ink);stroke-opacity:.6;stroke-width:1;fill:none}
#ov .bal{fill:var(--sheet);stroke:var(--sheet-ink);stroke-width:1.2;pointer-events:auto;cursor:pointer}
#ov .bal.on{fill:var(--sheet-hot);stroke:var(--sheet-hot)}
#ov .bt{font-size:10.5px;text-anchor:middle;pointer-events:none}
#ov .bt.on{fill:#16202b;font-weight:600}
#ov .tb{fill:var(--sheet);stroke:var(--sheet-ink);stroke-width:1}
.orb{position:absolute;right:10px;bottom:10px;display:grid;gap:6px}
.orb button{width:40px;height:40px;border-radius:10px;border:0;background:rgba(10,16,24,.72);color:#fff;font:700 20px var(--f-mono);cursor:pointer;line-height:1}
.hint{position:absolute;left:10px;bottom:10px;right:60px;font:12px var(--f-body);color:#fff;pointer-events:none}
.hint span{background:rgba(10,16,24,.6);padding:3px 9px;border-radius:999px}
.tag{position:absolute;left:10px;top:10px;font:600 12px var(--f-mono);color:#fff;background:rgba(10,16,24,.62);padding:4px 10px;border-radius:999px;pointer-events:none}
.no3d{padding:40px 16px;text-align:center;margin:0;color:var(--ink)}
.range{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:12px}
.range input{width:100%;accent-color:var(--accent)}
.range button{font:600 13px var(--f-body);padding:7px 12px;border-radius:8px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
.capt{font-size:13px;color:var(--muted);margin:8px 0 0}
.parts{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.parts button{width:100%;display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:center;text-align:left;font:500 14px var(--f-body);padding:7px 8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;border-radius:8px}
.parts button i{font:600 12px var(--f-mono);font-style:normal;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center}
.parts button[aria-pressed="true"]{border-color:var(--accent);background:var(--tag-bg);font-weight:600}
.parts button[aria-pressed="true"] i{background:var(--accent);border-color:var(--accent);color:#fff}
.sheetcard{border-top:4px solid var(--accent);margin-top:12px;padding-top:10px;display:grid;gap:10px}
.sheetcard dl{margin:0;display:grid;gap:10px}
.sheetcard dt{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sheetcard dd{margin:2px 0 0;font-size:14px}
.sheetcard dd.lim{border-left:3px solid var(--warn);padding-left:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.two p{margin:0;font-size:14px}
.spec{display:flex;flex-wrap:wrap;gap:6px 18px;font:13px var(--f-mono);color:var(--muted);margin:0 0 10px}
.spec b{color:var(--ink);font-weight:600}
.lims{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lims button{width:100%;text-align:left;display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:4px 14px;padding:9px 10px;border:0;border-left:3px solid var(--warn);background:var(--bg);color:var(--ink);font:14px var(--f-body);cursor:pointer}
.lims button b{font-weight:600}
@media (max-width:640px){.lims button{grid-template-columns:1fr}}
.note{font-size:12.5px;color:var(--muted);margin:0}
.who{list-style:none;margin:0 0 14px;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.who li{font-size:13.5px;padding:5px 11px;border-radius:999px;background:var(--tag-bg);border:1px solid var(--line)}
.lens{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.ln{border-top:3px solid var(--lc);padding-top:8px}
.ln small{font:600 11.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.ln p{margin:4px 0 0;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.stat{border:1px solid var(--line);padding:12px;display:grid;gap:4px;align-content:start;background:var(--bg)}
.stat .k{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat.w .k{color:var(--accent)}
.stat b{font:700 30px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.stat p{margin:0;font-size:14px}
.stat a{font-size:12px;color:var(--muted)}
.sys{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.sys p{margin:0 0 8px;font-size:14.5px}
.bioA{margin:0 0 14px;font:600 17px var(--f-body)}
.sys button{font:600 13px var(--f-body);padding:6px 12px;border-radius:999px;border:1.5px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
.crew{margin-top:16px;padding:12px 14px;background:var(--tag-bg);border-left:4px solid var(--accent)}
.crew p{margin:0;font-size:14.5px}
.src{font-size:13px;color:var(--muted);columns:2 320px;margin:0;padding-left:18px}
.src a{color:var(--ink)}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<div class="wrap">
 <header class="top">
  <div>
   <div class="eyebrow" data-i="eyebrow"></div>
   <h1 data-i="title"></h1>
   <p class="lede" data-i="lede"></p>
  </div>
  <div style="display:grid;gap:10px;justify-items:end">
   <a class="boardbtn" id="lk-board" href="./index.html" data-i="lkBoard"></a>
  </div>
 </header>

 <div class="vehs" id="vehs" role="group" aria-label="Vehicle"></div>

 <div class="desk">
  <div class="card">
   <div class="bar">
    <div class="seg" role="group" aria-label="Mode"><button type="button" id="mode-3d" data-mode="3d" data-i="m3d"></button><button type="button" id="mode-2d" data-mode="2d" data-i="m2d"></button></div>
    <button type="button" class="chip" id="run" data-i="run"></button>
    <button type="button" class="chip" id="xray" data-i="xray"></button>
   </div>
   <div class="view" id="view"><div id="gl"></div><svg id="ov" aria-hidden="true"></svg>
    <span class="tag" id="tag"></span>
    <div class="orb" id="orb"><button type="button" data-orb="in" aria-label="Zoom in">+</button><button type="button" data-orb="out" aria-label="Zoom out">−</button><button type="button" data-orb="reset" aria-label="Reset view">⟲</button></div>
    <div class="hint" id="hint"><span data-i="hint"></span></div>
   </div>
   <div class="range"><button type="button" id="asm" data-i="asm"></button><input type="range" id="ex" min="0" max="100" value="0" aria-label="Explode"><button type="button" id="exp" data-i="exp"></button></div>
   <p class="capt" id="capt"></p>
  </div>
  <div class="card">
   <span class="lbl" data-i="lParts"></span>
   <ul class="parts" id="parts"></ul>
   <div class="sheetcard" id="sheet"></div>
  </div>
 </div>

 <section class="card">
  <h2 id="h-std"></h2>
  <p class="spec" id="spec"></p>
  <div class="two"><div><span class="lbl" data-i="lMake"></span><p id="make"></p></div><div><span class="lbl" data-i="lKeep"></span><p id="keep"></p></div></div>
 </section>

 <section class="card">
  <h2 id="h-sys"></h2>
  <div class="sys" id="sys"></div>
 </section>

 <section class="card">
  <h2 id="h-bio"></h2>
  <p class="note" data-i="bioNote" style="margin-bottom:12px"></p>
  <span class="lbl" data-i="lBio"></span><p class="bioA" id="bioA"></p>
  <div class="lens" id="bio"></div>
 </section>

 <section class="card">
  <h2 id="h-stat"></h2>
  <p class="note" data-i="statNote" style="margin-bottom:12px"></p>
  <div class="stats" id="stats"></div>
 </section>

 <section class="card">
  <h2 id="h-ppl"></h2>
  <p class="note" data-i="pplNote" style="margin-bottom:12px"></p>
  <span class="lbl" data-i="lWho"></span><ul class="who" id="who"></ul>
  <div class="lens" id="lens"></div>
  <div class="crew"><span class="lbl" data-i="lCrew"></span><p id="crew"></p></div>
 </section>

 <section class="card">
  <h2 data-i="hLim"></h2>
  <p class="note" data-i="limNote" style="margin-bottom:10px"></p>
  <ul class="lims" id="lims"></ul>
 </section>

 <section>
  <h2 data-i="hSrc" style="font-size:20px"></h2>
  <p class="note" data-i="srcNote" style="margin-bottom:8px"></p>
  <ol class="src" id="src"></ol>
 </section>
</div>

function sp(g,r,x,y,z,m,sx=1,sy=1,sz=1){const o=new THREE.Mesh(new THREE.SphereGeometry(r,20,14),m);o.scale.set(sx,sy,sz);return add(g,o,x,y,z);}

 make:B("โครงสร้างและทางออกตาม UN R107 ความแข็งแรงเมื่อพลิกคว่ำตาม UN R66 วัสดุภายในตาม UN R118 ในไทย รถโดยสารที่จดทะเบียนใหม่ตั้งแต่ปี 2556 และสูงเกิน 3.6 ม. ต้องผ่านการทดสอบพื้นเอียง 30 องศา","Construction and exits to UN R107, rollover strength to UN R66, interior materials to UN R118. In Thailand, buses newly registered since 2013 and taller than 3.6 m must pass a 30-degree tilt test."),
 keep:B("ตรวจสภาพตามรอบของกรมการขนส่งทางบก ถังก๊าซ CNG มีอายุใช้งานและต้องตรวจตามกำหนด ระบบเบรกลมต้องระบายน้ำและตรวจรั่วสม่ำเสมอ","Inspected on the Department of Land Transport's cycle. CNG cylinders have a service life and scheduled checks, and air brakes need regular draining and leak tests."),
 txt:{
  super:["โครงตัวถังกันพลิกคว่ำ","Rollover superstructure","โครงเหล็กกล่องเชื่อมเป็นวงรอบห้องโดยสาร ต้องคงพื้นที่รอดชีวิตไว้เมื่อรถพลิกคว่ำ","Welded steel hoops around the cabin that must keep a survival space when the bus rolls over.","UN R66 (ความแข็งแรงของโครงสร้างเมื่อพลิกคว่ำ) UN R107 · ดูแล: ตรวจสนิมที่โคนเสาและรอยเชื่อม","UN R66 (superstructure strength in rollover), UN R107 · Upkeep: check pillar bases and welds for rust.","จุดศูนย์ถ่วงสูง โดยเฉพาะรถสองชั้น การทดสอบพื้นเอียงกำหนดไว้ที่ 28–35 องศาแล้วแต่ประเทศและแบบรถ (ไทย 30 องศา)","A high centre of gravity, above all on double-deckers. Tilt tests are set at 28–35 degrees depending on country and type (Thailand: 30 degrees)."],
  chassis:["แชสซีและเพลา","Chassis and axles","คานเหล็กตามยาวสองเส้น รับน้ำหนักเครื่องยนต์ เพลา และตัวถัง","Two long steel rails that carry the engine, the axles and the body.","ดูแล: ตรวจรอยร้าวและการต่อเติมที่ไม่ได้รับอนุญาต","Upkeep: check for cracks and unauthorised modifications.","การต่อเติมตัวถังให้สูงหรือยาวกว่าที่แชสซีออกแบบไว้ทำให้การทรงตัวและเบรกแย่ลง","Bodies built taller or longer than the chassis was designed for hurt stability and braking."],

  seats:["ที่นั่งและเข็มขัด","Seats and belts","ที่นั่งยึดกับพื้นและผนัง ออกแบบให้รับแรงของคนด้านหลังที่พุ่งมาชน","Seats anchored to floor and wall, designed to take the load of the passenger behind.","UN R80 (ความแข็งแรงของที่นั่ง) R14/R16 (เข็มขัด) · ดูแล: จุดยึดที่นั่งและหัวเข็มขัด","UN R80 (seat strength), R14/R16 (belts) · Upkeep: seat mounts and buckles.","ที่นั่งที่เพิ่มเองหรือยึดไม่ได้มาตรฐานหลุดจากพื้นเมื่อชน","Added or poorly anchored seats tear loose in a crash."],
  fuel:["ถังก๊าซ CNG","CNG cylinders","ถังความดันสูงราว 200 บาร์ ติดตั้งใต้ท้องรถ","High-pressure cylinders at about 200 bar under the floor.","UN R110 (ระบบ CNG) · ดูแล: ตรวจถัง วาล์ว และท่อตามกำหนด ถังมีวันหมดอายุ","UN R110 (CNG systems) · Upkeep: scheduled checks of cylinders, valves and lines; cylinders have an expiry date.","ก๊าซที่รั่วในที่ปิดติดไฟได้เร็ว วาล์วระบายความดันปล่อยก๊าซออกเมื่อถังร้อน","Leaked gas ignites fast in enclosed spaces; relief valves vent the gas when a cylinder gets hot."],
  fire:["ระบบตรวจจับและดับเพลิงห้องเครื่อง","Engine-bay fire detection and suppression","สายตรวจจับความร้อนรอบเครื่องยนต์ และถังสารดับเพลิงพร้อมหัวฉีด","A heat-sensing line around the engine and an extinguisher bottle with nozzles.","UN R107 (ตรวจจับและดับเพลิงห้องเครื่อง) UN R118 (วัสดุภายในลามไฟช้า) · ดูแล: ตรวจความดันถังและสายตรวจจับ","UN R107 (engine-bay detection and suppression), UN R118 (slow-burning interior materials) · Upkeep: check bottle pressure and the sensing line.","ดับได้เฉพาะในห้องเครื่อง ไฟที่เริ่มในห้องโดยสารหรือที่ยางต้องพึ่งการหนีออกให้เร็ว","Covers only the engine bay; a fire starting in the cabin or at a tyre leaves escape as the only defence."],
  wheels:["ล้อและยาง","Wheels and tyres","ล้อหน้าเดี่ยว ล้อหลังคู่ รับน้ำหนักเพลาละหลายตัน","Single front and twin rear wheels, each axle carrying several tonnes.","UN R54 (ยางรถเพื่อการพาณิชย์) · ดูแล: ลมยาง ดอกยาง และยางหล่อดอกที่หมดสภาพ","UN R54 (commercial vehicle tyres) · Upkeep: pressures, tread and worn retreads.","ยางระเบิดที่ล้อหน้าทำให้เสียการบังคับทันที ยางที่ลมอ่อนร้อนจนลุกไหม้ได้","A front blowout takes away steering at once, and an under-inflated tyre can heat until it burns."]},

 keep:B("สมาคมจัดชั้นเรือตรวจประจำปี ตรวจกลางรอบ และตรวจใหญ่ทุก 5 ปี เรือต้องขึ้นอู่แห้งตรวจท้องเรือ 2 ครั้งในรอบ 5 ปี บริษัทเรือต้องมีระบบจัดการความปลอดภัยตาม ISM Code และรัฐเมืองท่าสุ่มตรวจเรือที่เข้าเทียบ","Class carries out annual, intermediate and five-yearly special surveys, with the bottom inspected in dry dock twice in five years. The operator runs a safety management system under the ISM Code, and port states inspect visiting ships."),
 txt:{
  hull:["ตัวเรือ","Hull","แผ่นเหล็กเชื่อมบนโครงกงและคานตามยาว ท้องเรือและข้างเรือเป็นสองชั้น","Welded steel plating on frames and longitudinals, with a double bottom and double sides.","กฎสมาคมจัดชั้นเรือ และ IACS UR S11A (ความแข็งแรงตามยาวของเรือตู้สินค้า) · ดูแล: วัดความหนาเหล็กและตรวจการผุกร่อนตอนขึ้นอู่","Class rules and IACS UR S11A (longitudinal strength of container ships) · Upkeep: thickness measurements and corrosion surveys in dry dock.","ตัวเรือเป็นเหมือนคานยาว คลื่นทำให้แอ่นกลาง (sagging) หรือโก่งกลาง (hogging) ถ้าจัดน้ำหนักผิดหรือเจอคลื่นใหญ่เกิน เรืออาจหักกลางลำ","The hull is a long beam that waves bend into sagging or hogging; with bad loading or extreme seas it can break its back."],
  bow:["หัวเรือกระเปาะ","Bulbous bow","กระเปาะใต้น้ำสร้างคลื่นหักล้างคลื่นหัวเรือ ลดแรงต้านและประหยัดเชื้อเพลิง","An underwater bulb whose wave cancels the bow wave, cutting drag and fuel use.","ดูแล: ตรวจรอยบุบและการผุกร่อน","Upkeep: check for dents and corrosion.","ออกแบบมาสำหรับความเร็วและระดับกินน้ำค่าเดียว วิ่งช้าลงหรือบรรทุกเบากว่านั้นประสิทธิภาพลดลง","Tuned for one speed and draught; slower steaming or lighter loading makes it less effective."],
  holds:["ระวาง ผนังกั้นน้ำ และตู้สินค้า","Holds, bulkheads and containers","ผนังกั้นน้ำตามขวางแบ่งเรือเป็นห้อง ตู้สินค้าซ้อนในระวางและบนฝาระวาง ยึดด้วยตัวล็อกและเหล็กรัด","Transverse watertight bulkheads divide the ship; containers stack in the holds and on the hatch covers, held by twistlocks and lashing rods.","CSS Code (การจัดเก็บและผูกรัดสินค้า) · SOLAS บังคับแจ้งน้ำหนักตู้ที่ชั่งจริง (VGM) · ดูแล: ตรวจตัวล็อกและอุปกรณ์ผูกรัด","CSS Code (cargo stowage and securing) · SOLAS requires a verified gross mass for each container · Upkeep: inspect twistlocks and lashings.","ตู้ซ้อนสูง เรือโคลงแรงตู้หล่นทะเลได้ น้ำหนักตู้ที่แจ้งผิดทำให้คำนวณเสถียรภาพผิด","Tall stacks can go overboard in heavy rolling, and mis-declared weights throw off the stability calculation."],
  engine:["เครื่องยนต์หลัก","Main engine","เครื่องดีเซลสองจังหวะรอบต่ำ ต่อตรงกับเพลาใบจักร สูงเท่าตึกหลายชั้น","A slow-speed two-stroke diesel coupled straight to the propeller shaft, as tall as a multi-storey building.","MARPOL Annex VI (ไอเสีย) และกฎสมาคมจัดชั้นเรือ · ดูแล: ซ่อมตามชั่วโมงทำงาน","MARPOL Annex VI (exhaust emissions) and class rules · Upkeep: overhauls by running hours.","เรือส่วนใหญ่มีเครื่องเดียว ใบจักรเดียว ถ้าเครื่องดับหรือไฟดับ เรือบังคับไม่ได้","Most ships have one engine and one propeller; if it stops or the power fails, the ship cannot be controlled."],
  prop:["เพลาและใบจักร","Shaft and propeller","เพลาเหล็กยาวหมุนใบจักรทองเหลืองผสมขนาดเส้นผ่านศูนย์กลางเกือบ 10 เมตร","A long steel shaft turning a bronze-alloy propeller almost 10 m across.","IMO MSC.137(76) (มาตรฐานการบังคับเรือ) · ดูแล: ซีลเพลา และขัดผิวใบจักร","IMO MSC.137(76) (manoeuvrability standards) · Upkeep: shaft seals and blade polishing.","เดินเครื่องถอยหลังเต็มที่แล้วเรือยังไถลต่อไปอีกไกล เกณฑ์ IMO ยอมให้ถึง 15 เท่าของความยาวเรือ","Even at full astern the ship keeps going a long way; the IMO criterion allows up to 15 ship lengths."],
  rudder:["หางเสือและเครื่องถือท้าย","Rudder and steering gear","หางเสือหลังใบจักร หมุนด้วยเครื่องไฮดรอลิก","A rudder behind the propeller turned by hydraulic steering gear.","SOLAS บทที่ II-1 กำหนดให้มีเครื่องถือท้ายหลักและสำรอง · ดูแล: ทดสอบเครื่องถือท้ายก่อนออกเรือ","SOLAS chapter II-1 requires main and auxiliary steering gear · Upkeep: steering gear test before departure.","หางเสือทำงานได้เมื่อมีน้ำไหลผ่าน ความเร็วต่ำเรือเลี้ยวช้า วงเลี้ยวกว้างได้ถึงราว 5 เท่าของความยาวเรือ","A rudder needs water flowing past it; at low speed the ship turns slowly, in a circle up to about 5 ship lengths across."],
  bridge:["สะพานเดินเรือและที่พัก","Bridge and accommodation","ห้องบังคับเรือ อุปกรณ์เดินเรือ ที่พักลูกเรือ และปล่องไอเสีย","The wheelhouse, navigation equipment, crew quarters and the funnel.","SOLAS บทที่ V (เรดาร์ AIS แผนที่อิเล็กทรอนิกส์ เครื่องบันทึกข้อมูลการเดินเรือ) และ STCW (คุณวุฒิคนประจำเรือ)","SOLAS chapter V (radar, AIS, electronic charts, voyage data recorder) and STCW (crew qualifications).","ตู้สินค้าบังสายตาด้านหน้า SOLAS ยอมให้มีจุดบอดหน้าเรือได้ไม่เกิน 2 ช่วงลำเรือหรือ 500 เมตร แล้วแต่ค่าใดน้อยกว่า","Containers block the view ahead; SOLAS allows a blind sector of up to two ship lengths or 500 m, whichever is less."],
  ballast:["ถังอับเฉา","Ballast tanks","ถังน้ำทะเลในท้องเรือและข้างเรือ ใช้ปรับการทรงตัวและระดับกินน้ำ","Seawater tanks in the double bottom and sides, used to trim and steady the ship.","Intact Stability Code (เสถียรภาพ) และอนุสัญญาน้ำอับเฉา (BWM) · ดูแล: สีเคลือบถังและการผุกร่อน","Intact Stability Code and the Ballast Water Management Convention · Upkeep: tank coatings and corrosion.","เสถียรภาพขึ้นกับการจัดน้ำอับเฉาและสินค้า จัดผิดเรือเอียงหรือพลิกคว่ำได้","Stability depends on how ballast and cargo are arranged; get it wrong and the ship lists or capsizes."],
  lifeboat:["เรือชูชีพและแพชูชีพ","Lifeboat and liferafts","เรือชูชีพแบบปล่อยทิ้งตัวที่ท้ายเรือ และแพชูชีพในถังที่ปล่อยตัวเองได้","A free-fall lifeboat at the stern and liferafts in canisters that release by themselves.","SOLAS บทที่ III และ LSA Code · ดูแล: ซ้อมสละเรือและตรวจอุปกรณ์เป็นประจำ","SOLAS chapter III and the LSA Code · Upkeep: regular abandon-ship drills and equipment checks.","ใช้ได้ผลเมื่อลูกเรือซ้อมมาและมีเวลาพอ เรือที่เอียงมากหรือจมเร็วปล่อยเรือชูชีพยาก","Works when the crew is drilled and there is time; a heavy list or fast sinking makes launching hard."]},

DEFS.plane={n:B("เครื่องบินโดยสาร","Airliner"),mass:B("น้ำหนักวิ่งขึ้นสูงสุดราว 78 ตัน","about 78 t maximum take-off"),ref:B("อ้างอิง: เครื่องบินทางเดินเดี่ยวสองเครื่องยนต์","Reference: single-aisle twinjet"),
 make:B("ต้องได้ใบรับรองแบบตาม 14 CFR Part 25 ของสหรัฐฯ หรือ CS-25 ของยุโรป เครื่องยนต์รับรองแยกตาม Part 33 หรือ CS-E โรงงานต้องมีใบรับรองการผลิต และเครื่องทุกลำต้องมีใบสำคัญสมควรเดินอากาศ","Needs a type certificate under US 14 CFR Part 25 or European CS-25, with engines certified separately under Part 33 or CS-E. The factory holds a production approval and every aircraft an airworthiness certificate."),
 keep:B("แผนซ่อมบำรุงจัดทำตามหลัก MSG-3 ตั้งแต่ตรวจก่อนบิน ตรวจย่อยทุกไม่กี่ร้อยชั่วโมงบิน ตรวจใหญ่ราวทุก 2 ปี ไปจนถึงตรวจโครงสร้างทั้งลำทุก 6–12 ปี งานทำโดยศูนย์ซ่อมที่ได้รับการรับรอง (Part 145) และเมื่อพบข้อบกพร่อง หน่วยงานกำกับออกคำสั่งบังคับแก้ไข (AD)","The maintenance programme follows MSG-3 logic: pre-flight checks, light checks every few hundred flight hours, heavy checks about every 2 years and full structural inspections every 6–12 years. Work is done by approved organisations (Part 145), and regulators issue mandatory airworthiness directives when defects emerge."),
 txt:{
  fuselage:["ลำตัว","Fuselage","เปลือกอะลูมิเนียมหรือคอมโพสิตบนกงและคานยาว ทำหน้าที่เป็นถังอัดความดันให้ห้องโดยสาร","An aluminium or composite skin on frames and stringers, acting as the pressure vessel for the cabin.","Part/CS 25.571 (ทนความเสียหายและความล้า) และ 25.365 (ภาระจากความดัน) · ดูแล: ตรวจรอยร้าวและการผุกร่อนตามแผนตรวจโครงสร้าง","Part/CS 25.571 (damage tolerance and fatigue) and 25.365 (pressurisation loads) · Upkeep: scheduled structural inspections for cracks and corrosion.","ทุกเที่ยวบินคือหนึ่งรอบของการพองและหด เครื่องบินมีจำนวนรอบสูงสุดที่แผนซ่อมบำรุงรองรับ","Every flight is one pressurisation cycle, and the aircraft has a maximum number of cycles its maintenance programme supports."],
  wing:["ปีกและถังเชื้อเพลิง","Wing and fuel tanks","กล่องปีกจากคานหน้า คานหลัง และผิวปีก ข้างในเป็นถังเชื้อเพลิง","A wing box of front and rear spars and skins, with the fuel tanks inside.","Part/CS 25.301–25.337: แรงใช้งานสูงสุด 2.5 g และต้องทนได้ 1.5 เท่าของแรงนั้นโดยไม่พัง · ดูแล: ตรวจจุดต่อปีกกับลำตัวและการรั่วของถัง","Part/CS 25.301–25.337: a 2.5 g limit manoeuvring load, and no failure at 1.5 times limit load · Upkeep: wing-to-fuselage joints and tank leaks.","น้ำหนัก ความเร็ว และแรง g สูงสุด รวมกันเป็นกรอบการบิน บินเกินกรอบแล้วโครงสร้างเสียหายถาวรได้","Maximum weight, speed and g together form the flight envelope; outside it the structure can be permanently damaged."],
  highlift:["แฟลปและสแลต","Flaps and slats","แผ่นที่ยื่นออกจากชายปีกหน้าและหลัง เพิ่มแรงยกตอนบินช้า","Surfaces that extend from the leading and trailing edges to add lift at low speed.","Part/CS 25.697–25.701 · ดูแล: รางเลื่อน สกรูขับ และการหล่อลื่น","Part/CS 25.697–25.701 · Upkeep: tracks, drive screws and lubrication.","ถ้ากางไม่ออก ความเร็วร่อนลงสูงขึ้นและต้องใช้รันเวย์ยาวขึ้นมาก","If they fail to extend, the landing speed and the runway needed both go up sharply."],
  tail:["แพนหางและพื้นบังคับ","Tail and control surfaces","แพนหางดิ่งพร้อมหางเสือ และแพนหางระดับพร้อมแผ่นบังคับขึ้นลง","The fin with its rudder and the tailplane with its elevators.","Part/CS 25.671 (ระบบบังคับต้องทนความขัดข้องเดี่ยวได้) · ดูแล: ตัวขับไฮดรอลิกและจุดหมุน","Part/CS 25.671 (controls must tolerate single failures) · Upkeep: hydraulic actuators and hinges.","เหยียบหางเสือสุดสลับซ้ายขวาที่ความเร็วสูงสร้างแรงเกินที่แพนหางดิ่งออกแบบไว้","Full alternating rudder inputs at speed can load the fin beyond its design strength."],
  engine:["เครื่องยนต์เทอร์โบแฟน","Turbofan engines","พัดลมหน้าสร้างแรงขับส่วนใหญ่ แกนกลางเผาเชื้อเพลิงเพื่อหมุนกังหัน","The front fan makes most of the thrust; the core burns fuel to drive the turbines.","14 CFR Part 33 / CS-E: ทดสอบดูดนก และใบพัดที่หลุดต้องถูกกักไว้ในตัวเรือน · ดูแล: ส่องกล้องตรวจภายใน และชิ้นส่วนหมุนจำกัดอายุตามรอบการใช้งาน","14 CFR Part 33 / CS-E: bird-ingestion tests, and a released fan blade must be contained · Upkeep: borescope inspections and life-limited rotating parts.","ออกแบบให้บินต่อและไต่ได้เมื่อเครื่องยนต์ดับหนึ่งเครื่อง ไม่ใช่ทั้งสองเครื่อง ฝูงนกใหญ่หรือเถ้าภูเขาไฟอยู่นอกขอบเขตที่ทดสอบ","Designed to keep flying and climbing with one engine out, not both; large bird flocks or volcanic ash go beyond what was tested."],

  cockpit:["ห้องนักบินและระบบควบคุมการบิน","Flight deck and flight controls","คอมพิวเตอร์ควบคุมการบินหลายชุดทำงานซ้ำซ้อนกัน รับข้อมูลจากเซนเซอร์วัดความเร็วและมุมปะทะ","Several redundant flight control computers fed by airspeed and angle-of-attack sensors.","Part/CS 25.1309: ความขัดข้องขั้นหายนะต้องเกิดได้ยากอย่างยิ่ง · ซอฟต์แวร์ตาม DO-178C · ดูแล: ทดสอบระบบและอัปเดตซอฟต์แวร์ตามคำสั่ง","Part/CS 25.1309: catastrophic failures must be extremely improbable · software to DO-178C · Upkeep: system tests and mandated software updates.","ระบบป้องกันพึ่งเซนเซอร์ ถ้าเซนเซอร์ให้ค่าผิด ระบบอาจสั่งงานผิด นักบินต้องรู้วิธีตัดระบบและบินเอง","Protections rely on sensors; with bad sensor data the system can command the wrong thing, and pilots must know how to take over."],
  apu:["ผนังกั้นความดันท้ายและ APU","Aft pressure bulkhead and APU","ผนังโดมปิดท้ายห้องโดยสารที่อัดความดัน ถัดไปคือเครื่องยนต์ช่วย (APU) สำหรับไฟฟ้าและลมตอนจอด","A dome closing the back of the pressurised cabin; behind it the auxiliary power unit supplies electricity and air on the ground.","Part/CS 25.365 และ 25.571 · ดูแล: ตรวจผนังกั้นและงานซ่อมเก่าอย่างละเอียด","Part/CS 25.365 and 25.571 · Upkeep: close inspection of the bulkhead and of old repairs.","งานซ่อมที่ทำผิดวิธีอาจล้าจนแตกหลังบินไปหลายปี ดังอุบัติเหตุ JAL เที่ยวบิน 123 ปี 1985","A wrongly made repair can fatigue and burst years later, as in the Japan Air Lines flight 123 accident of 1985."]},

 txt:{
  fuselage:["ลำตัวและห้องโดยสาร","Fuselage and cabin","โครงอะลูมิเนียมและคอมโพสิต พื้นและที่นั่งออกแบบให้ยุบดูดซับแรงกระแทกแนวดิ่ง","An aluminium and composite structure whose floor and seats crush to absorb vertical impact.","Part/CS 27 และ 29 ข้อ .561–.562 (สภาพการชนและที่นั่งดูดซับแรง) · ดูแล: ตรวจรอยร้าวที่จุดยึดเกียร์และหาง","Part/CS 27 and 29, .561–.562 (crash conditions and energy-absorbing seats) · Upkeep: cracks at gearbox and tail attachments.",null,null],
  blades:["ใบพัดหลัก","Main rotor blades","ใบคอมโพสิตยาว สร้างทั้งแรงยกและแรงขับด้วยการเปลี่ยนมุมใบขณะหมุน","Long composite blades that make both lift and thrust by changing pitch as they turn.","Part/CS 29.571 (ความล้า) · ดูแล: ตรวจรอยร้าวและการหลุดล่อนของชั้นวัสดุ เปลี่ยนเมื่อครบอายุ","Part/CS 29.571 (fatigue) · Upkeep: check for cracks and delamination; replace at life limit.","ยิ่งบินเร็ว ใบที่หมุนถอยหลังยิ่งเสียแรงยก (retreating blade stall) เฮลิคอปเตอร์จึงมีความเร็วสูงสุดต่ำกว่าเครื่องบินมาก","The faster it flies, the more the retreating blade stalls, so a helicopter's top speed is far below an aeroplane's."],

  engine:["เครื่องยนต์เทอร์โบชาฟต์","Turboshaft engines","เครื่องยนต์กังหันสองเครื่องส่งกำลังเข้าเกียร์หลัก","Two turbine engines feeding the main gearbox.","14 CFR Part 33 / CS-E · ดูแล: ส่องกล้องตรวจ ล้างคอมเพรสเซอร์ และชิ้นส่วนจำกัดอายุ","14 CFR Part 33 / CS-E · Upkeep: borescope checks, compressor washes and life-limited parts.","เครื่องดับหมดยังร่อนลงได้ด้วยการหมุนอิสระของใบพัด (autorotation) แต่มีช่วงความสูงกับความเร็วที่ทำไม่ทัน เรียกว่า dead man's curve","With all engines out it can still land by autorotation, but in some height and speed combinations there is not enough time: the dead man's curve."],
  tail:["หางและใบพัดหาง","Tail boom and tail rotor","ใบพัดหางต้านแรงบิดจากใบพัดหลัก ขับด้วยเพลายาวตามแนวหาง","The tail rotor counters main rotor torque, driven by a long shaft along the boom.","ดูแล: ลูกปืนเพลาขับ เกียร์หาง และรอยร้าวที่หาง","Upkeep: driveshaft bearings, tail gearbox and boom cracks.","ถ้าใบพัดหางเสียแรงหรือเพลาขับขาด เครื่องจะหมุนรอบตัวเอง","If the tail rotor loses effectiveness or its shaft fails, the helicopter spins."],

DEFS.drone={n:B("โดรน","Drone"),mass:B("ราว 0.9 กก.","about 0.9 kg"),ref:B("อ้างอิง: โดรนถ่ายภาพสี่ใบพัด","Reference: camera quadcopter"),
 make:B("ในยุโรปต้องได้เครื่องหมายคลาส C0–C6 ตาม Regulation (EU) 2019/945 ซึ่งกำหนดน้ำหนัก ความเร็ว เสียง และระบบระบุตัวตนระยะไกล แบตเตอรี่ต้องผ่านการทดสอบ UN 38.3 จึงขนส่งได้","In Europe a drone carries a C0–C6 class mark under Regulation (EU) 2019/945, which sets mass, speed, noise and remote identification. Batteries must pass UN 38.3 testing before they can be shipped."),
 keep:B("ไม่มีรอบซ่อมบังคับเหมือนอากาศยานใหญ่ ผู้บังคับต้องตรวจก่อนบินทุกครั้ง ได้แก่ ใบพัด แบตเตอรี่ เข็มทิศ และเฟิร์มแวร์ ในไทยต้องขึ้นทะเบียนโดรนและผู้บังคับตามที่กฎหมายกำหนด","There is no mandated overhaul cycle as for large aircraft: the pilot checks propellers, battery, compass and firmware before every flight. Thailand requires drones and pilots to be registered as the law sets out."),
 txt:{
  frame:["โครงและแขน","Frame and arms","พลาสติกเสริมใยหรือคาร์บอนไฟเบอร์ แขนพับได้ น้ำหนักต้องเบาที่สุด","Fibre-reinforced plastic or carbon fibre with folding arms, as light as possible.","EU 2019/945 แบ่งคลาสตามน้ำหนักวิ่งขึ้นสูงสุด · ดูแล: ตรวจรอยร้าวที่ข้อพับแขน","EU 2019/945 sets classes by maximum take-off mass · Upkeep: check arm hinges for cracks.","เกณฑ์ 250 กรัมเป็นเส้นแบ่งสำคัญของกฎหลายประเทศ เพราะหนักกว่านั้นพลังงานตอนตกใส่คนสูงขึ้นมาก","The 250 g threshold matters in many countries' rules because above it the energy of a fall onto a person rises sharply."],
  motors:["มอเตอร์ไร้แปรงถ่าน","Brushless motors","มอเตอร์สี่ตัวเปลี่ยนรอบหมุนหลายร้อยครั้งต่อวินาทีเพื่อทรงตัว","Four motors that change speed hundreds of times a second to keep the drone level.","ดูแล: ฟังเสียงลูกปืนและเป่าฝุ่นทราย","Upkeep: listen to the bearings and clear sand and dust.","ความร้อนและลมแรงทำให้มอเตอร์ทำงานเต็มกำลังตลอด เหลือกำลังสำรองน้อย","Heat and strong wind keep the motors at full power with little in reserve."],
  props:["ใบพัด","Propellers","ใบพลาสติกสองคู่ หมุนสวนทางกันเพื่อหักล้างแรงบิด","Two pairs of plastic blades turning in opposite directions to cancel torque.","ดูแล: เปลี่ยนทันทีเมื่อบิ่นหรือร้าว","Upkeep: replace at once if chipped or cracked.","โดรนสี่ใบพัดไม่มีสำรอง มอเตอร์หรือใบพัดเสียหนึ่งตัวก็ตก","A quadcopter has no redundancy: lose one motor or propeller and it falls."],
  fc:["แผงควบคุมการบินและ GPS","Flight controller and GPS","เซนเซอร์วัดการเอียง เข็มทิศ GPS และตัวขับมอเตอร์ รวมกันบนแผงวงจร","Attitude sensors, compass, GPS and motor drivers on one set of boards.","ระบบระบุตัวตนระยะไกล (Remote ID) ตาม ASTM F3411 หรือข้อกำหนดยุโรป · ดูแล: อัปเดตเฟิร์มแวร์และสอบเทียบเข็มทิศ","Remote ID to ASTM F3411 or the European rules · Upkeep: firmware updates and compass calibration.","พึ่ง GPS และเข็มทิศ สัญญาณรบกวนหรือโครงเหล็กใกล้ๆ ทำให้โดรนลอยหลุดตำแหน่ง","Depends on GPS and compass; jamming or nearby steel can make it drift away."],
  battery:["แบตเตอรี่ลิเทียม","Lithium battery","แบตลิเทียมโพลิเมอร์ เป็นชิ้นที่หนักที่สุดของโดรน","A lithium-polymer pack, the heaviest single part.","UN 38.3 (ทดสอบแบตเตอรี่ลิเทียมเพื่อการขนส่ง) · ดูแล: ไม่ใช้แบตบวม เก็บที่ประจุราวครึ่ง","UN 38.3 (lithium battery transport tests) · Upkeep: never fly a swollen pack; store at about half charge.","บินได้ราว 20–40 นาที อากาศหนาวแรงดันตกเร็ว แบตที่เสียหายลุกไหม้ได้","Flight time is about 20–40 minutes; cold makes voltage sag, and a damaged pack can catch fire."],
  gimbal:["กล้องและกิมบอล","Camera and gimbal","กล้องบนแกนกันสั่นสามแกน","A camera on a three-axis stabilised mount.","ดูแล: ถอดตัวล็อกก่อนบินและเช็ดเลนส์","Upkeep: remove the lock before flight and clean the lens.","มุมมองแคบและไม่มีเสียง ผู้บังคับที่ดูแต่จอจะไม่เห็นอากาศยานอื่นที่เข้ามาใกล้","A narrow, silent view: a pilot watching only the screen will not notice other aircraft approaching."],
  radio:["วิทยุและเสาอากาศ","Radio and antennas","รับคำสั่งและส่งภาพกลับ ใช้คลื่น 2.4 และ 5.8 กิกะเฮิรตซ์","Receives commands and sends video back on 2.4 and 5.8 GHz.","ดูแล: ตั้งค่า failsafe (กลับบ้านหรือลงจอด) ก่อนบินทุกครั้ง","Upkeep: set the failsafe (return home or land) before every flight.","ระยะสัญญาณจำกัด อาคารและภูเขาบังสัญญาณได้ เมื่อหลุดแล้วทุกอย่างขึ้นกับ failsafe ที่ตั้งไว้","Range is limited and buildings or hills block the link; once it drops, everything depends on the failsafe."],
  gear:["ขาลงจอดและเซนเซอร์ด้านล่าง","Landing legs and downward sensors","ขาสั้นใต้แขน พร้อมกล้องและเซนเซอร์วัดความสูงสำหรับลงจอด","Short legs under the arms with cameras and height sensors for landing.","ดูแล: เช็ดเซนเซอร์ให้สะอาด","Upkeep: keep the sensors clean.","เซนเซอร์หลบสิ่งกีดขวางมองไม่เห็นสายไฟ กิ่งไม้เล็ก และกระจก","Obstacle sensors miss wires, thin branches and glass."]},

DEFS.rocket={n:B("จรวด","Rocket"),mass:B("ราว 550 ตันตอนปล่อย","about 550 t at lift-off"),ref:B("อ้างอิง: จรวดสองท่อนบรรทุกลูกเรือ ท่อนแรกใช้ซ้ำได้","Reference: two-stage crewed launcher with a reusable first stage"),
 make:B("โครงสร้างออกแบบตามค่าความปลอดภัยของ NASA-STD-5001 หรือ ECSS ของยุโรป จรวดเชิงพาณิชย์ของสหรัฐฯ ต้องได้ใบอนุญาตปล่อยตาม 14 CFR Part 450 และยานบรรทุกคนต้องผ่านข้อกำหนด human-rating ของ NASA","Structures use the safety factors of NASA-STD-5001 or Europe's ECSS. US commercial launches need a licence under 14 CFR Part 450, and crewed vehicles must meet NASA's human-rating requirements."),
 keep:B("จรวดใช้ครั้งเดียวไม่มีการซ่อมบำรุง ใช้การทดสอบรับรองทุกชิ้นและทดสอบจุดเครื่องก่อนปล่อยแทน ส่วนท่อนแรกที่ใช้ซ้ำต้องตรวจและฟื้นสภาพเครื่องยนต์ ขา และถังก่อนบินเที่ยวถัดไป","An expendable rocket is never maintained; acceptance tests of every part and a static fire before launch take its place. A reusable first stage is inspected and refurbished (engines, legs, tanks) before each reflight."),
 txt:{
  s1:["ถังเชื้อเพลิงท่อนแรก","First-stage tanks","ถังอะลูมิเนียม-ลิเทียมผนังบาง บรรจุออกซิเจนเหลวและเชื้อเพลิง ต้องอัดความดันเพื่อช่วยรับแรง","Thin-walled aluminium-lithium tanks of liquid oxygen and fuel, pressurised to help carry the loads.","NASA-STD-5001: ค่าความปลอดภัยขั้นต่ำ 1.4 ต่อจุดแตกหักสำหรับโครงสร้างโลหะที่ทดสอบต้นแบบ · ดูแล: ทดสอบอัดความดันและตรวจรอยเชื่อมทุกถัง","NASA-STD-5001: a minimum ultimate factor of 1.4 for metallic structure verified by prototype test · Upkeep: proof-pressure tests and weld inspection of every tank.","เชื้อเพลิงคิดเป็นราว 90% ของมวลตอนปล่อย โครงสร้างจึงเผื่อได้น้อยกว่าเครื่องบิน (1.4 เทียบกับ 1.5)","Propellant is about 90% of lift-off mass, so structural margins are thinner than an aircraft's (1.4 against 1.5)."],
  engines:["เครื่องยนต์และโครงรับแรงขับ","Engines and thrust structure","เครื่องยนต์เก้าตัวบนโครงรับแรงขับ ปั๊มเทอร์โบส่งเชื้อเพลิงหลายร้อยกิโลกรัมต่อวินาที","Nine engines on a thrust structure, each turbopump moving hundreds of kilograms of propellant a second.","ดูแล: ทดสอบจุดเครื่องทุกตัวก่อนติดตั้ง และทดสอบจุดทั้งท่อนบนแท่นก่อนปล่อย","Upkeep: acceptance firing of each engine, then a static fire of the whole stage on the pad.","ทำงานใกล้ขีดจำกัดของวัสดุ จรวดที่มีเครื่องยนต์หลายตัวอาจทนเครื่องดับได้หนึ่งตัว และต้องมีตัวหน่วงการสั่นตามแนวแกน (pogo)","Runs close to material limits; a multi-engine stage may tolerate one engine out, and needs suppressors for axial (pogo) oscillation."],
  inter:["ช่วงต่อระหว่างท่อน","Interstage","ปลอกคอมโพสิตเชื่อมท่อนแรกกับท่อนสอง ภายในมีกลไกดันแยกท่อน","A composite sleeve joining the stages, with the separation pushers inside.","ดูแล: ทดสอบกลไกแยกท่อนบนพื้นก่อนประกอบ","Upkeep: ground tests of the separation mechanism before stacking.","การแยกท่อนต้องเกิดในจังหวะที่กำหนดพอดี ถ้าแยกไม่ออกภารกิจจบทันที","Separation must happen exactly on time; if it fails, the mission is over."],
  s2:["ท่อนที่สอง","Second stage","ท่อนบนมีเครื่องยนต์หัวฉีดใหญ่สำหรับสุญญากาศ ส่งยานเข้าวงโคจร","The upper stage with a large vacuum nozzle that takes the spacecraft to orbit.","NASA-STD-5001 · ดูแล: ใช้ครั้งเดียว ตรวจรับก่อนประกอบ","NASA-STD-5001 · Upkeep: single use; accepted before stacking.","ต้องจุดเครื่องในสุญญากาศได้สำเร็จ จุดไม่ติดคือไปไม่ถึงวงโคจร","It must ignite in vacuum; no ignition means no orbit."],
  capsule:["แคปซูลลูกเรือและโล่กันความร้อน","Crew capsule and heat shield","ห้องอัดความดันสำหรับลูกเรือ มีโล่กันความร้อนด้านล่างและร่มชูชีพสำหรับลงจอด","A pressurised cabin with a heat shield underneath and parachutes for landing.","NASA NPR 8705.2 (ข้อกำหนดสำหรับระบบที่บรรทุกคน) · ดูแล: ตรวจและเปลี่ยนโล่กันความร้อนและร่มทุกเที่ยว","NASA NPR 8705.2 (human-rating requirements) · Upkeep: inspect or replace the heat shield and parachutes every flight.","กลับเข้าบรรยากาศที่ราว 7.8 กม./วินาที ถ้าโล่กันความร้อนเสียหายไม่มีทางแก้กลางทาง","Re-entry is at about 7.8 km/s, and a damaged heat shield cannot be fixed on the way down."],
  les:["ระบบหนีภัยขณะปล่อย","Launch escape system","จรวดเชื้อเพลิงแข็งดึงแคปซูลออกจากจรวดที่กำลังมีปัญหา","Solid rocket motors that pull the capsule clear of a failing launcher.","ดูแล: ทดสอบการหนีภัยจากแท่นปล่อยและระหว่างบินก่อนใช้งานจริง","Upkeep: pad-abort and in-flight abort tests before crewed use.","ช่วยได้เฉพาะช่วงการบินที่ออกแบบไว้ และลูกเรือต้องรับแรงหลายเท่าของแรงโน้มถ่วง","Covers only the flight phases it was designed for, and the crew takes many g."],
  legs:["ขาลงจอดและครีบตะแกรง","Landing legs and grid fins","ขาคาร์บอนไฟเบอร์กางออกตอนลงจอด ครีบตะแกรงบังคับทิศทางตอนตกกลับ","Carbon-fibre legs deploy for landing; grid fins steer the stage on the way down.","ดูแล: ตรวจและฟื้นสภาพระหว่างเที่ยวบิน","Upkeep: inspected and refurbished between flights.","เชื้อเพลิงสำหรับลงจอดเหลือน้อยมาก จุดเครื่องช้าหรือเร็วไปเสี้ยววินาทีคือชนพื้นหรือเชื้อเพลิงหมดกลางอากาศ","Landing propellant is tiny: lighting the engine a fraction of a second early or late means hitting the ground or running dry in the air."],

  econ:B("การสร้างรางและระบบแพงมาก แต่ขนคนได้มหาศาลต่อชั่วโมง จึงคุ้มในเส้นทางที่ผู้โดยสารหนาแน่น ขบวนรถใช้งานได้ 30–40 ปี การดูแลรักษาจึงเป็นค่าใช้จ่ายหลัก","Track and systems are very expensive but move huge numbers of people per hour, so rail pays off on busy corridors. Trains serve 30–40 years, which makes maintenance the main cost."),
  psy:B("รางกำหนดเส้นทางไว้แน่นอน คนจึงรู้สึกว่าคาดเดาได้และปลอดภัย ความตรงเวลาสร้างความเชื่อมั่น แต่เหตุร้ายแรงครั้งเดียวกระทบความเชื่อมั่นได้นานหลายปี","Rails fix the route, so people find trains predictable and safe. Punctuality builds trust, but one serious accident can shake it for years."),
  crew:B("พนักงานขับต้องเรียนรู้เส้นทางทุกช่วง ฝึกในเครื่องจำลอง และสอบทบทวนเป็นรอบ ระบบป้องกันขบวนรถอัตโนมัติจะสั่งเบรกเองถ้าฝ่าสัญญาณหรือเร็วเกิน ศูนย์ควบคุมซ้อมแผนอพยพร่วมกับหน่วยดับเพลิง","Drivers learn every section of the route, train in simulators and are re-assessed on a cycle. Automatic train protection brakes if a signal is passed or speed is too high, and control centres rehearse evacuations with the fire service.")},
 ship:{who:[B("อู่ต่อเรือ","Shipyards"),B("สมาคมจัดชั้นเรือ","Classification societies"),B("รัฐเจ้าของธงและรัฐเมืองท่า","Flag states and port states"),B("เจ้าของเรือและบริษัทบริหารเรือ","Shipowners and ship managers"),B("นายเรือ ลูกเรือ และนำร่อง","Masters, crews and pilots")],
  phys:B("เรือลอยได้เพราะแรงลอยตัวเท่ากับน้ำหนักน้ำที่ถูกแทนที่ จะตั้งตรงหรือคว่ำขึ้นกับตำแหน่งจุดศูนย์ถ่วงเทียบกับจุดลอยตัว มวลมหาศาลทำให้หยุดและเลี้ยวได้ช้ามาก","A ship floats because buoyancy equals the weight of water it displaces. Whether it stays upright depends on where its centre of gravity sits relative to its buoyancy, and its huge mass makes stopping and turning very slow."),
  mat:B("ตัวเรือเป็นแผ่นเหล็กกล้าเชื่อมต่อกัน ศัตรูหลักคือสนิมจากน้ำทะเลและความล้าจากคลื่น จึงต้องมีสี แอโนดกันกร่อน และการวัดความหนาเหล็กเป็นรอบ","The hull is welded steel plate. Its enemies are seawater corrosion and wave fatigue, hence coatings, sacrificial anodes and regular thickness measurements."),
  econ:B("เรือยิ่งใหญ่ ค่าขนส่งต่อตู้ยิ่งถูก การค้าโลกส่วนใหญ่จึงเดินทางทางทะเล แต่ตารางเวลาที่แน่นและลูกเรือจำนวนน้อยสร้างแรงกดดันต่อการตัดสินใจด้านความปลอดภัย","The bigger the ship, the cheaper each container, which is why most world trade moves by sea. Tight schedules and small crews put pressure on safety decisions."),
  psy:B("ลูกเรืออยู่กลางทะเลครั้งละหลายเดือน ความล้าและความโดดเดี่ยวมีผลต่อการเฝ้าระวัง คนบนฝั่งแทบไม่เห็นอุตสาหกรรมนี้ จนกว่าจะมีเรือเกยตื้นหรือน้ำมันรั่ว","Crews spend months at sea, and fatigue and isolation affect watchkeeping. People ashore barely notice the industry until a ship runs aground or spills oil."),
  crew:B("นายประจำเรือต้องมีประกาศนียบัตรตามอนุสัญญา STCW ฝึกในเครื่องจำลองสะพานเดินเรือ และซ้อมสละเรือกับดับไฟเป็นประจำ เมื่อเข้าท่า นำร่องที่รู้จักร่องน้ำจะขึ้นมาช่วยนำเรือ","Officers hold STCW certificates, train on bridge simulators and run abandon-ship and fire drills regularly. In port approaches a local pilot who knows the channel comes aboard to guide the ship.")},
 plane:{who:[B("ผู้ผลิตเครื่องบินและเครื่องยนต์","Aircraft and engine makers"),B("หน่วยรับรอง (FAA, EASA, ไทย: กพท.)","Certification authorities (FAA, EASA, national CAAs)"),B("สายการบินและศูนย์ซ่อม","Airlines and maintenance organisations"),B("ควบคุมการจราจรทางอากาศ","Air traffic control"),B("นักบิน ลูกเรือ และหน่วยสอบสวนอิสระ","Pilots, cabin crew and independent investigators")],
  phys:B("ปีกสร้างแรงยกจากอากาศที่ไหลผ่าน แรงยกเพิ่มตามความเร็วยกกำลังสอง จึงมีความเร็วต่ำสุดที่ยังบินได้ เครื่องบินบินสูงเพราะอากาศเบาบาง แรงต้านน้อย ประหยัดเชื้อเพลิง","Wings make lift from the air flowing over them, and lift rises with speed squared, so there is a minimum flying speed. Airliners cruise high because thin air means less drag and less fuel."),
  mat:B("โครงสร้างเป็นอะลูมิเนียมอัลลอยและคาร์บอนไฟเบอร์ ออกแบบโดยสมมติว่าจะมีรอยร้าวเกิดขึ้น แล้ววางรอบตรวจให้เจอก่อนที่รอยร้าวจะยาวถึงขั้นอันตราย","The structure is aluminium alloy and carbon fibre, designed on the assumption that cracks will appear, with inspections timed to find them before they grow dangerous."),
  econ:B("เครื่องบินแพงมาก จึงต้องบินวันละหลายเที่ยว น้ำหนักทุกกิโลกรัมที่ลดได้ประหยัดเชื้อเพลิงตลอดอายุเครื่อง แต่ส่วนเผื่อความปลอดภัยถูกกำหนดด้วยกฎ ลดเองไม่ได้ และอุบัติเหตุครั้งเดียวทำลายชื่อเสียงได้ทั้งบริษัท","Aircraft are very expensive, so they fly several sectors a day. Every kilogram saved cuts fuel for life, but safety margins are fixed by rule and cannot be traded away, and one accident can ruin a company's name."),
  psy:B("หลายคนกลัวการบินเพราะไม่ได้คุมเองและเหตุร้ายเป็นข่าวใหญ่ ทั้งที่เป็นการเดินทางที่ปลอดภัยที่สุดต่อระยะทาง ในห้องนักบินใช้หลักการทำงานเป็นทีม (CRM) ให้ทุกคนกล้าทักท้วงกัปตัน","Many people fear flying because they are not in control and crashes are big news, though it is the safest way to travel per kilometre. On the flight deck, crew resource management makes it normal to challenge the captain."),
  crew:B("นักบินสายการบินกลับเข้าเครื่องจำลองทุกประมาณ 6 เดือน เพื่อซ้อมเครื่องยนต์ดับ ไฟไหม้ และความดันตก และใช้รายการตรวจสอบแทนการจำ ลูกเรือฝึกอพยพผู้โดยสารและดับไฟในห้องโดยสารทุกปี","Airline pilots return to the simulator about every 6 months to practise engine failures, fires and decompression, and they work from checklists, not memory. Cabin crew retrain on evacuation and cabin fires every year.")},
 heli:{who:[B("ผู้ผลิตเฮลิคอปเตอร์","Helicopter makers"),B("หน่วยรับรองการบิน","Aviation authorities"),B("ผู้ให้บริการกู้ภัย แพทย์ฉุกเฉิน และงานนอกชายฝั่ง","Rescue, air-ambulance and offshore operators"),B("ช่างอากาศยาน","Aircraft engineers"),B("นักบินและทีมภาคพื้น","Pilots and ground crews")],
  phys:B("ใบพัดคือปีกที่หมุน จึงสร้างแรงยกได้แม้ลอยอยู่กับที่ แต่ต้องใช้กำลังมาก ถ้าเครื่องยนต์ดับ อากาศที่ไหลขึ้นผ่านใบพัดยังหมุนใบพัดต่อได้ ทำให้ร่อนลงจอดได้","The rotor is a spinning wing, so it lifts even in a hover, at a high cost in power. If the engines stop, air flowing up through the rotor keeps it turning, which allows a glide to a landing."),
  mat:B("ใบพัดเป็นวัสดุคอมโพสิต ชิ้นส่วนหมุนรับแรงสลับไปมาทุกรอบ จึงกำหนดอายุใช้งานเป็นชั่วโมงบินและเปลี่ยนตามกำหนด ไม่รอให้เห็นความเสียหาย","Blades are composite. Rotating parts take a reversing load on every turn, so they have a life in flight hours and are replaced on schedule, without waiting for visible damage."),
  econ:B("ค่าใช้จ่ายต่อชั่วโมงบินสูงกว่าเครื่องบินมาก จึงใช้ในงานที่คุ้มจริง เช่น ที่ที่ไม่มีรันเวย์ การกู้ภัย การส่งผู้ป่วย และแท่นขุดเจาะ","Each flight hour costs far more than an aeroplane's, so helicopters are used where they are worth it: places with no runway, rescue, air ambulance and offshore platforms."),
  psy:B("เสียงเฮลิคอปเตอร์เป็นสัญญาณว่าความช่วยเหลือมาถึง แต่นักบินกู้ภัยก็เผชิญแรงกดดันว่า 'ต้องไปให้ถึง' ซึ่งทำให้บางครั้งฝืนบินในอากาศที่ไม่ควรบิน","The sound of a helicopter means help has arrived. Rescue pilots also feel pressure to get there, which sometimes leads them to press on in weather they should not fly in."),
  crew:B("นักบินฝึกการร่อนลงเมื่อเครื่องดับ การบินด้วยเครื่องวัด และใช้เกณฑ์ตัดสินใจ 'ไป/ไม่ไป' ที่กำหนดไว้ก่อนรับภารกิจ ทีมภาคพื้นฝึกการเข้าใกล้เครื่องขณะใบพัดหมุน","Pilots practise autorotation and instrument flying, and use go/no-go criteria set before a mission is accepted. Ground crews train on approaching the aircraft while the rotors turn.")},
 drone:{who:[B("ผู้ผลิตโดรน","Drone makers"),B("ชุมชนซอฟต์แวร์ควบคุมการบินแบบโอเพนซอร์ส","Open-source flight-control communities"),B("หน่วยกำกับการบินและคลื่นความถี่","Aviation and radio-spectrum regulators"),B("ผู้บังคับโดรน","Remote pilots"),B("ผู้ให้บริการจัดการจราจรโดรน","Drone traffic-management providers")],
  phys:B("โดรนหลายใบพัดไม่มีปีก ทรงตัวด้วยการปรับรอบมอเตอร์แต่ละตัวหลายร้อยครั้งต่อวินาที โดยธรรมชาติแล้วไม่เสถียร ต้องพึ่งคอมพิวเตอร์ตลอดเวลาที่บิน","A multirotor has no wing. It balances by changing each motor's speed hundreds of times a second: it is naturally unstable and depends on its computer for every moment of flight."),
  mat:B("โครงเป็นพลาสติกหรือคาร์บอนไฟเบอร์ที่เบา แบตเตอรี่ลิเทียมเก็บพลังงานต่อน้ำหนักได้จำกัด เวลาบินจึงสั้น","The frame is light plastic or carbon fibre. Lithium batteries store limited energy for their weight, so flights are short."),
  econ:B("เซนเซอร์ ชิป และแบตเตอรี่มาจากอุตสาหกรรมโทรศัพท์มือถือ ราคาจึงถูกจนใครก็ซื้อได้ ผลคือมีโดรนจำนวนมากในมือผู้ใช้ที่ไม่เคยฝึก","Sensors, chips and batteries come from the phone industry, so drones are cheap enough for anyone. The result is many drones in untrained hands."),
  psy:B("โดรนดูเหมือนของเล่น คนจึงประเมินความเสี่ยงต่ำ คนข้างล่างอาจรู้สึกถูกรบกวนหรือถูกแอบมอง แต่โดรนก็สร้างแรงบันดาลใจ เช่น ภาพมุมสูง และการส่งยาไปที่ห่างไกล","A drone looks like a toy, so people underrate the risk. People below may feel disturbed or watched. Drones also inspire, with aerial views and medicine deliveries to remote places."),
  crew:B("งานเสี่ยงต่ำ ผู้บังคับเรียนและสอบออนไลน์ งานเสี่ยงสูงต้องประเมินความเสี่ยงของภารกิจและฝึกเฉพาะทาง สิ่งที่ช่วยได้จริงคือการตั้ง failsafe และเช็กเครื่องก่อนบินทุกครั้ง","For low-risk flying, pilots study and test online; higher-risk work needs a mission risk assessment and specific training. What helps most is setting the failsafe and doing a pre-flight check every time.")},
 rocket:{who:[B("หน่วยงานอวกาศและบริษัทเอกชน","Space agencies and private companies"),B("ผู้ผลิตเครื่องยนต์","Engine makers"),B("หน่วยออกใบอนุญาตปล่อยจรวด","Launch licensing authorities"),B("เจ้าหน้าที่ความปลอดภัยสนามยิง","Range safety officers"),B("ศูนย์ควบคุมภารกิจ นักบินอวกาศ และทีมกู้ภัย","Mission control, astronauts and recovery teams")],
  phys:B("ตามสมการจรวด ความเร็วที่ทำได้ขึ้นกับสัดส่วนของเชื้อเพลิงต่อมวลทั้งหมด จรวดจึงเป็นเชื้อเพลิงเกือบทั้งลำและต้องทิ้งท่อนที่ใช้หมดแล้ว การเข้าวงโคจรต้องเร็วราว 7.8 กม./วินาที","By the rocket equation, the speed gained depends on how much of the vehicle is propellant, so a rocket is almost all propellant and drops its empty stages. Orbit needs about 7.8 km/s."),
  mat:B("ถังเชื้อเพลิงเป็นโลหะผนังบางที่ได้ความแข็งแรงจากความดันภายใน เครื่องยนต์ทนความร้อนได้เพราะให้เชื้อเพลิงเย็นไหลผ่านผนังก่อนเผา แคปซูลมีแผ่นกันความร้อนสำหรับกลับสู่บรรยากาศ","Tanks are thin-walled metal, stiffened by their own pressure. Engines survive the heat because cold propellant flows through their walls before burning, and the capsule carries a heat shield for re-entry."),
  econ:B("เดิมจรวดใช้ครั้งเดียวทิ้ง แต่ละเที่ยวจึงแพงมาก การนำท่อนแรกกลับมาใช้ซ้ำลดต้นทุนต่อเที่ยวลง แต่เมื่อส่วนเผื่อทางโครงสร้างน้อย การทดสอบซ้ำๆ จึงเป็นสิ่งที่ซื้อความปลอดภัย","Rockets used to be thrown away after one flight, so each launch was very costly. Reusing the first stage cuts the price, but with thin structural margins it is repeated testing that buys safety."),
  psy:B("การปล่อยจรวดสร้างแรงบันดาลใจและความภูมิใจได้มากกว่าพาหนะใด แต่แรงกดดันเรื่องกำหนดการก็เคยทำให้คำเตือนของวิศวกรถูกมองข้าม ดังกรณีกระสวยอวกาศแชลเลนเจอร์ปี 1986","A launch inspires more than any other vehicle. Schedule pressure has also led managers to overrule engineers' warnings, as with the space shuttle Challenger in 1986."),
  crew:B("นักบินอวกาศฝึกหลายปีและซ้อมเหตุฉุกเฉินซ้ำในเครื่องจำลอง ศูนย์ควบคุมมีกฎการบินที่ตัดสินใจไว้ล่วงหน้าสำหรับแต่ละความผิดปกติ และผู้รับผิดชอบแต่ละระบบสั่งหยุดการนับถอยหลังได้","Astronauts train for years and rehearse emergencies again and again in simulators. Mission control works from flight rules that settle each failure in advance, and each system's controller can call a hold in the countdown.")}
};

 make:B("ยานที่มีคนนั่งควรผ่านการจัดชั้นตามกฎยานใต้น้ำของสมาคมจัดชั้นเรือ (เช่น DNV หรือ ABS) ส่วนที่คนอยู่และช่องมองออกแบบตาม ASME PVHO-1 และทรงกลมต้องผ่านการทดสอบความดันจริงก่อนใช้งาน","A crewed submersible should be classed under a classification society's underwater-vehicle rules (DNV or ABS, for example). The crew sphere and viewports follow ASME PVHO-1, and the sphere is proof-tested under real pressure before service."),
 keep:B("ตรวจทุกระบบก่อนและหลังการดำทุกครั้ง ยกเครื่องใหญ่ทุกไม่กี่ปีโดยถอดออกทั้งลำ แล้วให้สมาคมจัดชั้นรับรองซ้ำ ช่องมองอะคริลิกมีอายุใช้งานและต้องเปลี่ยนตามกำหนด","Every system is checked before and after each dive. Every few years the vehicle is stripped down for overhaul and re-certified by class. Acrylic viewports have a service life and are replaced on schedule."),
 txt:{
  hull:["ทรงกลมรับความดัน","Pressure hull (crew sphere)","ทรงกลมไทเทเนียมหนาหลายเซนติเมตร คนนั่งข้างในที่ความดันอากาศปกติ ทรงกลมเป็นรูปทรงที่กระจายแรงกดได้สม่ำเสมอที่สุด","A titanium sphere several centimetres thick; the crew sits inside at normal air pressure. A sphere spreads the squeeze more evenly than any other shape.","กฎจัดชั้นยานใต้น้ำ และ ASME PVHO-1 · ดูแล: ทดสอบความดันและตรวจหารอยร้าวตามรอบ","Class rules for underwater vehicles and ASME PVHO-1 · Upkeep: scheduled pressure tests and crack inspections.","ความดันเพิ่มราว 1 บรรยากาศทุก 10 เมตร ที่ 6,500 เมตรจึงราว 650 เท่าของผิวน้ำ ถ้าตัวถังรับไม่ไหวจะยุบตัวในเสี้ยววินาที ดังยาน Titan ที่ไม่ผ่านการจัดชั้นและยุบตัวในปี 2023","Pressure rises about 1 atmosphere every 10 m, so at 6,500 m it is about 650 times the surface. A hull that cannot take it implodes in a fraction of a second, as the unclassed Titan did in 2023."],
  view:["ช่องมองอะคริลิก","Acrylic viewports","แผ่นอะคริลิกหนาทรงกรวย ยิ่งลึกความดันยิ่งอัดให้แนบกับบ่ารองรับแน่นขึ้น","Thick cone-shaped acrylic windows; the deeper it goes, the harder pressure seats them.","ASME PVHO-1 กำหนดการออกแบบและอายุใช้งานของช่องมอง · ดูแล: ตรวจรอยร้าวฝอยและเปลี่ยนตามอายุ","ASME PVHO-1 sets viewport design and service life · Upkeep: inspect for crazing and replace on age.","มองเห็นได้เป็นช่องแคบๆ และอะคริลิกล้าตามจำนวนรอบการดำ จึงใช้ไปเรื่อยๆ ไม่ได้","The view is a narrow cone, and acrylic fatigues with every dive cycle, so it cannot stay in service forever."],
  frame:["โครงและเปลือกนอก","Frame and fairing","โครงโลหะยึดอุปกรณ์ทั้งหมดเข้าด้วยกัน เปลือกนอกไม่รับความดัน น้ำไหลเข้าออกได้อิสระ","A metal frame holds everything together. The outer fairing takes no pressure; water floods freely through it.","กฎจัดชั้น · ดูแล: ตรวจการกัดกร่อนและจุดยึด","Class rules · Upkeep: check corrosion and attachment points.","สายเคเบิล อวน หรือซากเรืออาจเกี่ยวโครงไว้ จนยานขึ้นสู่ผิวน้ำไม่ได้","Cables, nets or wreckage can snag the frame and stop the vehicle from surfacing."],
  foam:["โฟมลอยตัว","Syntactic foam buoyancy","โฟมอีพ็อกซีผสมลูกแก้วกลวงขนาดจิ๋ว ให้แรงลอยตัวโดยไม่ยุบแม้ความดันสูงมาก","Epoxy filled with tiny hollow glass spheres: it gives lift without crushing under very high pressure.","ดูแล: ทดสอบความดันทุกก้อน และชั่งน้ำหนักเพื่อหาการดูดซึมน้ำ","Upkeep: every block is pressure-tested and weighed to detect water uptake.","โฟมแต่ละเกรดมีความลึกสูงสุด ลึกเกินกว่านั้นลูกแก้วแตกและแรงลอยตัวหายไป","Each foam grade has a depth limit; beyond it the glass spheres break and the lift is lost."],
  ballast:["ถังปรับการลอยตัวและน้ำหนักถ่วง","Ballast spheres and drop weights","ลงด้วยน้ำหนักเหล็ก ทิ้งน้ำหนักเพื่อขึ้น และปรับละเอียดด้วยการสูบน้ำเข้าออกถังทรงกลม","It sinks on steel weights, drops them to rise, and trims by pumping water in and out of spheres.","กฎจัดชั้นกำหนดให้ทิ้งน้ำหนักได้แม้ไฟฟ้าดับ · ดูแล: ทดสอบกลไกปลดก่อนดำทุกครั้ง","Class rules require the weights to release even with no power · Upkeep: test the release before every dive.","การลงและขึ้นใช้เวลาเที่ยวละเป็นชั่วโมง เร่งไม่ได้ ถ้ามีเหตุฉุกเฉินก็ยังต้องรอ","Descent and ascent each take hours and cannot be hurried, even in an emergency."],
  thrust:["ใบพัดขับ","Thrusters","มอเตอร์ไฟฟ้าหลายตัวหมุนได้สองทาง ใช้เดินหน้า ถอยหลัง ขึ้นลง และหันข้าง","Several reversible electric thrusters for moving ahead, astern, up, down and sideways.","ดูแล: ซีลเพลาและน้ำมันชดเชยความดันในมอเตอร์","Upkeep: shaft seals and the pressure-compensating oil in each motor.","ความเร็วเพียงราว 1–2 นอต จึงสู้กระแสน้ำแรงไม่ได้ และต้องมีเรือแม่พาไปถึงจุดดำ","Speed is only about 1–2 knots, so it cannot fight a strong current and needs a mother ship to reach the dive site."],
  batt:["แบตเตอรี่","Batteries","แบตเตอรี่ลิเทียมไอออนในกระบอกทนความดัน เป็นแหล่งพลังงานเดียวของยาน","Lithium-ion batteries in pressure-tolerant pods: the vehicle's only energy source.","UN 38.3 และกฎจัดชั้น · ดูแล: ตรวจน้ำรั่วซึมและสุขภาพเซลล์","UN 38.3 and class rules · Upkeep: check for water ingress and cell health.","พลังงานจำกัดให้ดำได้ครั้งละราว 10 ชั่วโมง รวมเวลาลงและขึ้น เหลือเวลาทำงานที่ก้นทะเลไม่กี่ชั่วโมง","Energy limits a dive to about 10 hours including descent and ascent, leaving only a few hours of work on the bottom."],
  arms:["แขนกลและตะกร้าเก็บตัวอย่าง","Manipulators and sample basket","แขนไฮดรอลิกสองข้างหยิบหิน สัตว์ และเครื่องมือ แล้ววางลงตะกร้าด้านหน้า","Two hydraulic arms pick up rocks, animals and instruments and place them in the front basket.","ดูแล: ท่อไฮดรอลิก ข้อต่อ และกลไกสลัดแขนทิ้งฉุกเฉิน","Upkeep: hoses, joints and the emergency arm-jettison mechanism.","น้ำหนักตัวอย่างที่เก็บเปลี่ยนสมดุลการลอยตัว จึงเก็บได้จำกัด และแขนที่ติดค้างต้องสลัดทิ้งได้","Samples change the buoyancy balance, so the load is limited, and a trapped arm must be able to be jettisoned."],
  lights:["ไฟ กล้อง และโซนาร์","Lights, cameras and sonar","ไฟ LED กล้องความละเอียดสูง และโซนาร์ ใต้น้ำไม่มี GPS ยานจึงหาตำแหน่งด้วยเสียงร่วมกับเรือแม่","LED lights, high-resolution cameras and sonar. GPS does not work under water, so position comes from sound, with the mother ship.","ดูแล: ทดสอบระบบเสียงและไฟก่อนดำ","Upkeep: test the acoustic system and lights before the dive.","แสงไฟไปได้ไกลแค่หลายสิบเมตร รอบนอกมืดสนิท และการสื่อสารด้วยเสียงช้าและส่งข้อมูลได้น้อย","Light reaches only tens of metres into total darkness, and acoustic links are slow and carry little data."],
  life:["ระบบพยุงชีพ","Life support","ถังออกซิเจนเติมอากาศที่ลูกเรือใช้ และสารดูดซับดึงคาร์บอนไดออกไซด์ออก","Oxygen bottles replace what the crew breathes, and a scrubber removes the carbon dioxide.","กฎจัดชั้นกำหนดให้มีสำรองฉุกเฉินหลายวัน · ดูแล: เปลี่ยนสารดูดซับและเติมออกซิเจนทุกครั้ง","Class rules require days of emergency reserve · Upkeep: fresh scrubber and full oxygen every dive.","ถ้าติดอยู่ที่ก้นทะเล เวลาที่เหลือมีเท่าที่ออกซิเจนและสารดูดซับจะพอ และแทบไม่มียานลำอื่นที่ลงไปช่วยได้ทัน","If it is stuck on the bottom, the time left is whatever the oxygen and scrubber allow, and almost no other vehicle can get down in time to help."]},

  V.P("ballast",[0,-.7,0],0,g=>{[-1,1].forEach(s=>{sp(g,.32,-.2,1.0,s*.78,M(C_.st,.4,.6));[.7,-1.3].forEach(x=>bx(g,.5,.3,.25,x,.5,s*.98,M(C_.dk,.7,.4)));});});

   [[-3.95,1.6,.75,"x"],[-3.95,1.6,-.75,"x"],[-3.95,2.9,0,"x"],[-.3,2.3,1.42,"y"],[-.3,2.3,-1.42,"y"],[-2.9,1.1,0,"z"]].forEach(([x,y,z,ax])=>{const G=sub(g,x,y,z);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(.25,.045,8,22),m);if(ax==="x")ring.rotation.y=Math.PI/2;if(ax==="y")ring.rotation.x=Math.PI/2;G.add(ring);
    const P=sub(G,0,0,0);[0,1].forEach(i=>{const b=ax==="x"?bx(P,.04,.44,.08,0,0,0,pm):ax==="y"?bx(P,.44,.04,.08,0,0,0,pm):bx(P,.44,.08,.04,0,0,0,pm);b.rotation[ax]=i*Math.PI/2;});cy(P,.05,.05,.12,0,0,0,m,ax,10);R.pr.push([P,ax]);});});
  V.P("batt",[0,-1.25,0],0,g=>{[-1,1].forEach(s=>cy(g,.27,.27,2.2,-1.5,.72,s*.42,M(C_.ye,.5,.3),"x",18));});

PEOPLE.sub={who:[B("สถาบันวิจัยทางทะเลและองค์กรสำรวจ","Ocean research institutes and exploration organisations"),B("ผู้สร้างยานและผู้ผลิตทรงกลมรับความดัน","Builders and pressure-sphere makers"),B("สมาคมจัดชั้นเรือ","Classification societies"),B("ลูกเรือเรือแม่และทีมปล่อย-เก็บยาน","The mother ship's crew and launch-and-recovery team"),B("นักบินยานและนักวิทยาศาสตร์","Pilots and scientists")],
  phys:B("ยานลอยหรือจมขึ้นกับว่าหนักกว่าหรือเบากว่าน้ำที่ถูกแทนที่ จึงคุมการขึ้นลงด้วยน้ำหนักถ่วงและถังน้ำ ส่วนความดันเพิ่มตามความลึกอย่างสม่ำเสมอ ไม่มีทางหลบ ต้องรับไว้ด้วยตัวถังอย่างเดียว","It rises or sinks according to whether it weighs more or less than the water it displaces, so weights and water tanks control depth. Pressure grows steadily with depth; there is no way round it except a hull that takes it."),
  mat:B("ทรงกลมไทเทเนียมแข็งแรงต่อน้ำหนักสูงและไม่เป็นสนิมในน้ำทะเล โฟมลูกแก้วกลวงให้แรงลอยตัว วัสดุใหม่ที่ยังไม่มีข้อมูลความล้าต้องพิสูจน์ด้วยการทดสอบก่อนให้คนนั่ง","Titanium is strong for its weight and does not rust in seawater; glass-sphere foam gives lift. New materials without fatigue data must be proven by testing before people ride inside."),
  econ:B("ยานแบบนี้มีไม่กี่ลำในโลก และต้องมีเรือแม่ราคาแพงพร้อมทีมงานหลายสิบคน ค่าใช้จ่ายต่อวันสูงมาก งานสำรวจส่วนใหญ่จึงย้ายไปใช้ยานไร้คนขับ และยานมีคนนั่งเหลือไว้สำหรับงานที่ต้องใช้สายตาและการตัดสินใจของคน","Only a handful exist, each needing a costly mother ship and dozens of staff, so a day at sea is very expensive. Most survey work has moved to uncrewed vehicles, with crewed ones kept for jobs that need human eyes and judgement."),
  psy:B("การได้เห็นก้นทะเลด้วยตาตัวเองสร้างแรงบันดาลใจได้มาก และภาพจากใต้น้ำทำให้คนทั่วไปสนใจทะเล แต่การอยู่ในที่แคบ มืด และหนีออกไม่ได้ก็เป็นความกลัวพื้นฐานของคน เหตุยาน Titan ทำให้คนตั้งคำถามกับการท่องเที่ยวใต้ทะเลลึก","Seeing the seabed with your own eyes is deeply inspiring, and the footage draws the public to the ocean. A small, dark space with no way out is also a basic human fear, and the Titan loss made people question deep-sea tourism."),
  crew:B("นักบินยานฝึกเป็นปีๆ ก่อนได้คุมยานเอง ซ้อมเหตุไฟไหม้ ควัน ไฟฟ้าดับ และการติดพัน ทุกการดำมีรายการตรวจสอบและเกณฑ์ยกเลิกที่ตกลงกันไว้ก่อน และเรือแม่ติดตามตำแหน่งยานด้วยเสียงตลอดเวลา","Pilots train for years before commanding a dive, rehearsing fire, smoke, power loss and entanglement. Every dive runs on checklists and abort criteria agreed beforehand, and the mother ship tracks the vehicle by sound the whole time.")};

SYS.sub=[B("ใช้ไฟฟ้าจากแบตเตอรี่ลิเทียมไอออนทั้งหมด ไม่มีเครื่องยนต์เพราะใต้น้ำไม่มีอากาศให้เผาไหม้ ไฟต้องแบ่งกันระหว่างใบพัด ไฟส่องสว่าง แขนกล และระบบพยุงชีพ การขึ้นลงใช้แรงโน้มถ่วงกับแรงลอยตัว จึงแทบไม่กินไฟ","All power comes from lithium-ion batteries; there is no engine because there is no air to burn under water. Thrusters, lights, arms and life support share that power. Going down and up uses gravity and buoyancy, so it costs almost no electricity."),"batt",
 B("คลื่นวิทยุและ GPS ทะลุน้ำไม่ได้ คอมพิวเตอร์นำทางจึงรวมเข็มทิศไจโร เครื่องวัดความเร็วเทียบพื้นทะเลด้วยเสียง และตำแหน่งที่เรือแม่คำนวณจากสัญญาณเสียง อีกชุดเฝ้าระดับออกซิเจน คาร์บอนไดออกไซด์ และน้ำรั่ว","Radio and GPS cannot pass through water, so the navigation computer blends a gyrocompass, an acoustic bottom-speed log and a position the mother ship works out from sound. Another set of monitors watches oxygen, carbon dioxide and leaks."),"lights"];

const BIO={
 car:[B("ม้าและสัตว์วิ่งสี่ขา","Horses and other four-legged runners"),
  B("ใช้แรงเสียดทานกับพื้นดันตัวไปข้างหน้าเหมือนกัน และรถรุ่นแรกก็คือรถม้าที่เอาม้าออก ทรงลู่ลมของรถยุคหลังเรียนจากรูปทรงหยดน้ำและปลา","Both push against the ground through friction, and the first cars were carriages with the horse removed. Later streamlined bodies borrowed from teardrops and fish."),
  B("สัตว์ใหญ่ไม่มีล้อ เพราะอวัยวะที่หมุนรอบแกนได้ไม่รู้จบต้องขาดจากเส้นเลือดและเส้นประสาท ขาจึงก้าวข้ามสิ่งกีดขวางได้ ส่วนล้อเร็วและประหยัดแรงกว่ามาก แต่ต้องมีถนนเรียบ","Large animals have no wheels: a part that spins without end cannot stay connected to blood vessels and nerves. Legs step over obstacles; wheels are far faster and more efficient but need a smooth road."),
  B("ม้ามีตาอยู่ด้านข้าง มองได้เกือบรอบตัวราว 350 องศา คนขับมองได้ราว 180–200 องศาและชัดจริงแค่ตรงกลาง แถมมีเสาหลังคาบัง รถจึงต้องมีกระจกมองข้าง กล้อง และเรดาร์มาเติมส่วนที่ตาไม่เห็น","A horse's eyes sit on the sides and cover roughly 350 degrees. A driver sees about 180–200 degrees, sharply only in the centre, with roof pillars in the way, so mirrors, cameras and radar fill in what the eyes miss.")],
 moto:[B("สัตว์ที่วิ่งเร็วและเอียงตัวเข้าโค้ง เช่น เสือชีตาห์","Fast runners that lean into turns, such as the cheetah"),
  B("เอียงตัวเข้าโค้งเพื่อให้แรงจากพื้นผ่านจุดศูนย์ถ่วงเหมือนกัน และผู้ขี่ใช้ร่างกายถ่ายน้ำหนักเหมือนคนขี่ม้า","Both lean into a turn so the force from the ground passes through the centre of gravity, and the rider shifts body weight much as a horse rider does."),
  B("เสือชีตาห์ทรงตัวด้วยขาและหาง รถสองล้อทรงตัวได้เพราะล้อหน้าเลี้ยวรับเองเมื่อรถวิ่ง พอหยุดก็ล้ม","A cheetah balances with legs and tail. A motorcycle balances because the front wheel steers itself into a lean while moving; stop, and it falls over."),
  B("ผู้ขี่ไม่มีเสาหลังคาบัง แต่หมวกจำกัดมุมมอง กฎ UN R22 จึงกำหนดให้มองด้านข้างได้อย่างน้อย 105 องศาต่อข้าง และเมื่อเร็วขึ้นสายตาจะจดจ่อแคบลงไปข้างหน้า ปัญหาใหญ่กลับเป็นคนอื่นมองไม่เห็นรถจักรยานยนต์","A rider has no pillars in the way, but the helmet limits the view, so UN R22 requires at least 105 degrees to each side. Attention also narrows forward with speed. The bigger problem is that others fail to see the motorcycle.")],
 bus:[B("สัตว์ใหญ่ที่เดินทางเป็นฝูง เช่น ช้าง","Large animals that travel in herds, such as elephants"),

  B("ช้างวางเท้าทีละข้างและปรับสมดุลได้ทุกก้าว รถโดยสารพึ่งยาง ช่วงล่าง และระบบกันพลิกคว่ำ ถ้าเอียงเกินมุมที่ออกแบบไว้ก็แก้ตัวไม่ได้","An elephant places each foot and rebalances at every step. A bus relies on tyres, suspension and stability control; past its design tilt angle it cannot recover."),
  B("ฝูงสัตว์ช่วยกันมองรอบทิศ คนขับรถโดยสารมองคนเดียว นั่งสูง และตัวถังยาวบังด้านข้างกับด้านหลัง จุดบอดจึงใหญ่ โดยเฉพาะคนเดินเท้าและรถจักรยานยนต์ที่อยู่ชิดตัวรถ ต้องใช้กระจกหลายบานและกล้อง","A herd watches every direction together. A bus driver watches alone, sits high, and the long body hides the sides and rear, so blind spots are large, above all for pedestrians and motorcycles close alongside. Several mirrors and cameras are needed.")],
 train:[B("นกกระเต็น นกเค้าแมว และขบวนมด","Kingfisher, owl and a column of ants"),
  B("หัวรถไฟชินคันเซ็นรุ่น 500 ออกแบบตามจะงอยปากนกกระเต็น ซึ่งพุ่งจากอากาศลงน้ำได้โดยแทบไม่มีน้ำกระเซ็น เพื่อลดเสียงดังตอนออกจากอุโมงค์ ส่วนแหนบรับไฟลดเสียงลมด้วยรอยหยักแบบขนนกเค้าแมว","The Shinkansen 500's nose follows the kingfisher's beak, which dives from air into water with hardly a splash, to cut the boom when leaving a tunnel. Its pantograph quietens the wind with serrations like an owl's feathers."),
  B("มดเดินตามรอยกลิ่นและเปลี่ยนทางได้ รถไฟถูกบังคับด้วยราง เลี้ยวหลบไม่ได้ และล้อเหล็กบนรางเหล็กเสียดทานต่ำ จึงประหยัดพลังงานมากแต่เบรกได้ยาวมาก","Ants follow a scent trail and can change course. A train is held by the rails and cannot swerve, and steel wheels on steel rails have little friction: very efficient, but very long to stop."),
  B("ที่ความเร็วสูง ระยะเบรกยาวหลายกิโลเมตร ไกลกว่าที่ตาคนขับมองเห็น รถไฟจึงไม่ได้วิ่งด้วยสายตา แต่วิ่งด้วยระบบอาณัติสัญญาณที่บอกล่วงหน้าว่าทางข้างหน้าว่าง","At high speed the braking distance is several kilometres, farther than the driver can see. So a train does not run on eyesight; it runs on signalling that tells it in advance the line ahead is clear.")],
 ship:[B("นกน้ำ ปลา และวาฬ","Water birds, fish and whales"),
  B("ลอยได้ด้วยแรงลอยตัวเหมือนกัน และทรงท้องเรือเรียวเพื่อลดแรงต้านเหมือนลำตัวปลา หัวเรือแบบกระเปาะช่วยหักล้างคลื่นหัวเรือ","Both float on buoyancy, and a hull tapers to cut drag as a fish's body does. A bulbous bow cancels part of the bow wave."),
  B("ปลาและวาฬโบกหางหรือครีบไปมา เรือใช้ใบจักรที่หมุนต่อเนื่อง ซึ่งแทบไม่มีในสัตว์ การหมุนสร้างง่ายด้วยเครื่องยนต์ แต่หางที่โบกเลี้ยวได้คล่องและเงียบกว่า","Fish and whales sweep a tail or fins back and forth. A ship uses a propeller that turns continuously, something almost unknown in animals. Rotation is easy for an engine, but a sweeping tail turns more nimbly and more quietly."),
  B("วาฬและโลมาใช้เสียงมองในน้ำขุ่นและมืด เรือใช้เรดาร์เหนือน้ำและเครื่องหยั่งน้ำใต้ท้องเรือ จากสะพานเดินเรือ หัวเรือและสินค้าบังผิวน้ำด้านหน้า SOLAS จึงกำหนดให้บังได้ไม่เกิน 2 ช่วงลำเรือหรือ 500 เมตร แล้วแต่ค่าใดน้อยกว่า","Whales and dolphins see with sound in dark, murky water. A ship uses radar above the water and an echo sounder below. From the bridge, the bow and cargo hide the sea ahead, so SOLAS limits that hidden stretch to two ship lengths or 500 m, whichever is less.")],
 sub:[B("วาฬหัวทุย วาฬจงอย และหอยงวงช้าง (ไม่ใช่วาฬบรูด้า)","Sperm whale, beaked whales and the nautilus (not Bryde's whale)"),
  B("คุมความลึกด้วยการปรับแรงลอยตัวเหมือนกัน ปลามีถุงลม หอยงวงช้างปรับน้ำกับก๊าซในห้องเปลือก ยานใช้ถังน้ำกับน้ำหนักถ่วง ส่วนวาฬบรูด้าเป็นวาฬกรองกินที่หากินใกล้ผิวน้ำ นักดำลึกตัวจริงคือวาฬหัวทุยและวาฬจงอยที่ลงได้เป็นกิโลเมตร","Both control depth by adjusting buoyancy: fish with a swim bladder, the nautilus by shifting water and gas in its shell chambers, the vehicle with tanks and weights. Bryde's whale is a filter feeder that works near the surface; the true deep divers are sperm and beaked whales, which go down kilometres."),
  B("วาฬโบกหางขึ้นลงและยอมให้ปอดยุบตามความดัน จึงไม่ต้องต้านแรงกด ยานใช้ใบพัดไฟฟ้าตัวเล็ก และต้องต้านความดันไว้ทั้งหมดด้วยทรงกลม เพราะคนข้างในต้องอยู่ที่ความดันปกติ","A whale beats its tail up and down and lets its lungs collapse under pressure, so it has nothing to resist. The vehicle uses small electric thrusters and must hold all the pressure out with its sphere, because the people inside need normal pressure."),
  B("แสงแดดแทบหมดที่ราว 200 เมตร และมืดสนิทที่ราว 1,000 เมตร วาฬหัวทุยจึงล่าด้วยเสียงสะท้อน ยานมีไฟส่องได้ไกลแค่หลายสิบเมตร มองผ่านช่องอะคริลิกแคบๆ และใช้โซนาร์ดูสิ่งที่ไกลกว่านั้น","Sunlight is almost gone by about 200 m and completely gone by about 1,000 m, so sperm whales hunt by echo. The vehicle's lights reach only tens of metres, the view is through narrow acrylic ports, and sonar covers anything farther.")],
 plane:[B("นก โดยเฉพาะนกร่อนอย่างอินทรีและนกอัลบาทรอส","Birds, above all soarers such as eagles and albatrosses"),
  B("ปีกโค้งสร้างแรงยกจากอากาศที่ไหลผ่านเหมือนกัน พี่น้องไรต์คิดวิธีบิดปลายปีกเพื่อเอียงลำจากการเฝ้าดูนกร่อน และปลายปีกงอนของเครื่องบินทำหน้าที่คล้ายขนปลายปีกที่กางแยกของนกอินทรี","A curved wing makes lift from air flowing over it in both. The Wright brothers found wing-warping for roll control by watching soaring birds, and winglets work like the spread tip feathers of an eagle."),
  B("นกใช้ปีกคู่เดียวทั้งยกตัวและดันตัวด้วยการกระพือ เครื่องบินเกิดขึ้นได้เมื่อแยกสองหน้าที่ออกจากกัน คือปีกนิ่งไว้ยก และเครื่องยนต์ไว้ดัน ตามแนวคิดของจอร์จ เคย์ลีย์ เมื่อราวปี 1799","A bird uses one pair of wings for both lift and thrust by flapping. The aeroplane became possible once the two jobs were separated: a fixed wing for lift and an engine for thrust, the idea George Cayley set out around 1799."),
  B("นกอินทรีมองได้คมกว่าคนหลายเท่าและเห็นเหยื่อจากที่ไกลมาก นักบินมองออกนอกหน้าต่างได้จำกัด และในเมฆไม่เห็นอะไรเลย จึงบินด้วยเครื่องวัด เรดาร์ และระบบเตือนการชน","An eagle sees several times more sharply than a person and spots prey from far away. A pilot's view out is limited and inside cloud there is nothing to see, so the aircraft flies on instruments, radar and collision-warning systems.")],
 heli:[B("แมลงปอ นกฮัมมิงเบิร์ด และเมล็ดไม้มีปีกที่หมุนร่วงลงมา","Dragonfly, hummingbird and winged seeds that spin as they fall"),
  B("ลอยนิ่งและบินได้ทุกทิศเหมือนกัน เพราะทั้งคู่ผลักอากาศลงเพื่อยกตัวโดยไม่ต้องวิ่งไปข้างหน้า และเมื่อเครื่องยนต์ดับ ใบพัดที่หมุนเองขณะร่อนลงทำงานแบบเดียวกับเมล็ดไม้มีปีก","Both hover and fly in any direction, because both push air downward for lift without needing forward speed. With engine power lost, the rotor spinning by itself in the descent works just as a winged seed does."),
  B("แมลงปอกระพือปีกสี่ข้างไปมาหลายสิบครั้งต่อวินาที และคุมแต่ละข้างแยกกัน เฮลิคอปเตอร์หมุนใบพัดรอบแกนไปทางเดียว และเอียงมุมใบระหว่างหมุนเพื่อบังคับ การหมุนทำให้ลำตัวอยากหมุนสวน จึงต้องมีใบพัดหาง ซึ่งแมลงปอไม่ต้องมี","A dragonfly beats four wings back and forth tens of times a second and controls each one separately. A helicopter spins its blades one way round a shaft and changes blade angle during each turn to steer. That spin makes the body want to turn the other way, hence the tail rotor a dragonfly never needs."),
  B("ตารวมของแมลงปอมองได้เกือบรอบตัวและจับการเคลื่อนไหวได้ไวมาก นักบินมองได้ดีด้านหน้าและด้านล่างผ่านกระจก แต่ด้านหลังและใบพัดหางมองไม่เห็น ตอนลงจอดในที่แคบจึงต้องมีลูกเรือช่วยดู","A dragonfly's compound eyes cover almost every direction and catch motion very quickly. A pilot sees well ahead and below through the glazing but cannot see behind or the tail rotor, so the crew helps watch during confined landings.")],
 drone:[B("แมลงวันและผึ้ง","Flies and bees"),
  B("ตัวเล็ก ลอยนิ่งได้ และต้องแก้การทรงตัวหลายร้อยครั้งต่อวินาทีเหมือนกัน แมลงวันมีตุ้มทรงตัวที่สั่นและรับรู้การหมุนของลำตัว ซึ่งเป็นหลักการเดียวกับไจโรแบบชิปในโดรน","Both are small, hover, and must correct their balance hundreds of times a second. A fly has vibrating halteres that sense body rotation, the same principle as the chip gyroscope in a drone."),
  B("แมลงกระพือปีก โดรนหมุนใบพัดสี่ใบและบังคับด้วยการเร่งหรือผ่อนมอเตอร์แต่ละตัว ไม่มีชิ้นส่วนที่ขยับมุม ทำง่ายและถูก แต่ถ้ามอเตอร์ดับหนึ่งตัวก็ตก","Insects flap. A drone spins four propellers and steers by speeding up or slowing each motor, with no moving control surfaces: simple and cheap, but losing one motor brings it down."),
  B("ผึ้งกะความเร็วและความสูงจากภาพพื้นที่ไหลผ่านตา โดรนใช้กล้องมองพื้นทำแบบเดียวกันเพื่อลอยนิ่ง แต่คนบังคับมองผ่านกล้องมุมแคบและมีความหน่วง จึงเห็นน้อยกว่าแมลงที่มองได้เกือบรอบตัวมาก","A bee judges speed and height from the ground image flowing past its eyes, and a drone's downward camera does the same to hold position. The pilot, though, looks through a narrow, delayed camera and sees far less than an insect that sees almost all round.")],
 rocket:[B("หมึกและแมงกะพรุน","Squid and jellyfish"),
  B("พ่นมวลออกไปข้างหลังเพื่อให้ตัวพุ่งไปข้างหน้าเหมือนกัน ตามกฎข้อที่สามของนิวตัน โดยไม่ต้องมีอะไรให้ดัน","Both throw mass backward to go forward, by Newton's third law, with nothing to push against."),

 try{if(!window.THREE)throw 0;const c=document.createElement("canvas");if(!(c.getContext("webgl")||c.getContext("experimental-webgl")))throw 0;}catch(e){G3=false;$("gl").innerHTML=`<p class="no3d">${esc(tx(T.no3d))}</p>`;return false;}
 const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.setClearColor(0x000000,0);r.setPixelRatio(Math.min(2,window.devicePixelRatio||1));r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;$("gl").appendChild(r.domElement);

function overlay(views,box,sz,c){const w=G3.w,h=G3.h,f=n=>n>=100?n.toFixed(0):n>=10?n.toFixed(1):n>=1?n.toFixed(2):n.toFixed(3);let s="";

 const S=views[0],px=(v,u,vv)=>[v.x+v.w/2+(u-v.cu)*v.s,v.y+v.h/2-(vv-v.cv)*v.s];

 if(st.k<.02){s+=dimH(S,box.min.x,box.max.x,box.min.y,sz.x)+dimV(S,box.max.x,box.min.y,box.max.y,sz.y);const Tp=views[2],F=views[1];s+=dimV(Tp,box.max.x,-box.max.z,-box.min.z,sz.z)+dimH(F,-box.max.z,-box.min.z,box.min.y,sz.z);}
 const ps=V.parts.map(p=>{const b=new THREE.Box3().setFromObject(p.g),q=b.getCenter(new THREE.Vector3());return {p,pt:px(S,q.x,q.y)};}).sort((a,b)=>a.pt[0]-b.pt[0]);

function bind(){const el=$("view"),pts=new Map();let pinch=0,moved=0,down=null;

  {const Bi=BIO[st.veh];$("h-bio").textContent=tx(T.hBio)+": "+tx(D.n);$("bioA").textContent=tx(Bi[0]);$("bio").innerHTML=[[T.bSame,1,"var(--ok)"],[T.bDiff,2,"var(--warn)"],[T.bSee,3,"var(--accent)"]].map(([l,i,c])=>`<div class="ln" style="--lc:${c}"><small>${esc(tx(l))}</small><p>${esc(tx(Bi[i]))}</p></div>`).join("");}

 {const P=PEOPLE[st.veh];$("h-ppl").textContent=tx(T.hPpl)+": "+tx(D.n);$("who").innerHTML=P.who.map(w=>`<li>${esc(tx(w))}</li>`).join("");

{const h=location.hash.slice(1);if(DEFS[h])st.veh=h;}
